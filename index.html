function atualizarNivel() {
  const elXP = document.getElementById("xpUsuario");
  const elTitulo = document.getElementById("tituloUsuario");
  if(!elXP || !elTitulo) return;

  const xp = parseInt(elXP.innerText || 0);
  let titulo = "Iniciante Verde 🌱"; let cor = "text-green-200";
  if (xp >= 200 && xp < 500) { titulo = "Defensor Eco 🌿"; cor = "text-emerald-300"; }
  else if (xp >= 500 && xp < 1000) { titulo = "Guardião da Natureza 🌳"; cor = "text-yellow-300"; }
  else if (xp >= 1000) { titulo = "Mestre Sustentável 🌍"; cor = "text-amber-400"; }
  
  elTitulo.innerText = titulo;
  elTitulo.className = `mt-1 text-[10px] font-black uppercase tracking-wider ${cor}`;
  atualizarRelatorioGrafico();
}

function atualizarRelatorioGrafico() {
  const elTotalItens = document.getElementById("relTotalItens");
  const elTotalKg = document.getElementById("relTotalKg");
  const elTotalPontos = document.getElementById("relTotalPontos");
  const elTotalImpacto = document.getElementById("relTotalImpacto");
  const elLista = document.getElementById("relatorioLista");
  if(!elTotalItens || !elTotalKg || !elTotalPontos || !elTotalImpacto || !elLista) return;

  let totalItens = 0; let totalKg = 0; let totalPontos = 0; let totalImpacto = 0;
  let htmlDetalhes = "";
  
  for (const [chave, qtd] of Object.entries(historicoResiduos)) {
    if (qtd > 0) {
      totalItens += qtd;
      let pesoTotalClass = qtd * dadosReciclagem[chave].pesoKg;
      let pontosTotalClass = qtd * dadosReciclagem[chave].pontos;
      let impactoClass = qtd * dadosReciclagem[chave].pesoImpacto;
      
      totalKg += pesoTotalClass; 
      totalPontos += pontosTotalClass;
      totalImpacto += impactoClass;
      
      htmlDetalhes += `
        <div class="flex justify-between items-center bg-white p-3 rounded-xl border border-slate-200 mb-2 shadow-sm">
          <div><p class="font-bold text-sm text-slate-800">${dadosReciclagem[chave].nome}</p><p class="text-xs text-slate-500">${qtd} itens</p></div>
          <div class="text-right"><p class="font-bold text-green-700">+ ${pontosTotalClass} pts</p><p class="text-[10px] font-medium text-blue-500">↓ ${impactoClass.toFixed(2)}% imp.</p></div>
        </div>`;
    }
  }
  
  if (totalItens === 0) { htmlDetalhes = `<p class="text-xs text-center text-slate-500 italic mt-4">Ainda sem dados cadastrados.</p>`; }
  
  elTotalItens.innerText = totalItens;
  elTotalKg.innerText = totalKg.toFixed(2) + " kg";
  elTotalPontos.innerText = totalPontos + " pts";
  elTotalImpacto.innerText = "↓ " + totalImpacto.toFixed(2) + "%";
  elLista.innerHTML = htmlDetalhes;
}

document.getElementById("btnEntrar")?.addEventListener("click", async (e) => {
  e.preventDefault();
  const elEmail = document.getElementById("email");
  const elSenha = document.getElementById("senha");
  if(!elEmail || !elSenha) return;
  const email = elEmail.value.trim();
  const senha = elSenha.value;

  if(!email ||!senha) { alert("Preencha e-mail e senha!"); return; }
  try {
    const btn = document.getElementById("btnEntrar");
    if(btn) btn.innerText = "Acessando...";
    await signInWithEmailAndPassword(auth, email, senha);
    if(btn) btn.innerText = "Entrar";
  } catch(err) {
    const btn = document.getElementById("btnEntrar");
    if(btn) btn.innerText = "Entrar";
    alert("ERRO AO ENTRAR:\n" + err.message);
  }
});

document.getElementById("btnCriarConta")?.addEventListener("click", async (e) => {
  e.preventDefault();
  const elEmail = document.getElementById("email");
  const elSenha = document.getElementById("senha");
  const elNome = document.getElementById("nomeCompleto");
  const elWhatsapp = document.getElementById("whatsapp");
  const elNascimento = document.getElementById("dataNascimento");
  if(!elEmail || !elSenha || !elNome || !elWhatsapp || !elNascimento) return;

  const email = elEmail.value.trim();
  const senha = elSenha.value;
  const nome = elNome.value.trim();
  const whatsapp = elWhatsapp.value.trim();
  const dataNascimento = elNascimento.value;

  if(!nome ||!whatsapp ||!dataNascimento ||!email ||!senha) { alert("Preencha todos os campos!"); return; }
  if(senha.length < 6) { alert("Senha precisa ter pelo menos 6 dígitos!"); return; }

  try {
    const btn = document.getElementById("btnCriarConta");
    if(btn) btn.innerText = "Criando...";
    const userCredential = await createUserWithEmailAndPassword(auth, email, senha);
    const u = userCredential.user;
    
    await setDoc(doc(db, "usuarios", u.uid), {
      nomeCompleto: nome,
      whatsapp: whatsapp,
      dataNascimento: dataNascimento,
      email: email,
      dataCadastro: serverTimestamp()
    });

    if(btn) btn.innerText = "Criar Conta";
    alert("Conta criada com sucesso! Bem-vindo(a), " + nome + "!");
  } catch(err) {
    const btn = document.getElementById("btnCriarConta");
    if(btn) btn.innerText = "Criar Conta";
    alert("ERRO AO CRIAR CONTA:\n" + err.message);
  }
});

window.mudarAba = (nome) => {
  document.querySelectorAll(".aba-conteudo").forEach(el => el.classList.add("hidden"));
  document.querySelectorAll(".aba-btn").forEach(el => el.classList.remove("bg-green-600", "text-white"));
  const abaAtiva = document.getElementById(`aba-${nome}`);
  if(abaAtiva) abaAtiva.classList.remove("hidden");

  const botoes = document.querySelectorAll(".aba-btn");
  if (nome === "escanear") botoes[0].classList.add("bg-green-600", "text-white");
  if (nome === "mapa") botoes[1].classList.add("bg-green-600", "text-white");
  if (nome === "relatorio") botoes[2].classList.add("bg-green-600", "text-white");
  if (nome === "avaliar") botoes[3].classList.add("bg-green-600", "text-white");
  if (nome === "chat") botoes[4].classList.add("bg-green-600", "text-white");

  if(nome === "escanear") window.abrirCamera(); else window.pararCamera();
  if(nome === "relatorio") atualizarRelatorioGrafico();
};

onAuthStateChanged(auth, (u) => {
  const loginBox = document.getElementById("loginBox");
  const appContainer = document.getElementById("appContainer");
  const usuarioEl = document.getElementById("usuario");
  if(!loginBox || !appContainer || !usuarioEl) return;

  if (u) {
    loginBox.classList.add("hidden");
    appContainer.classList.remove("hidden");
    usuarioEl.innerText = u.email;
    carregarMensagens();
    atualizarNivel();
  } else {
    loginBox.classList.remove("hidden");
    appContainer.classList.add("hidden");
    if(window.pararCamera) window.pararCamera();
  }
});

  if(!elMsg || !u) return;
  const t = elMsg.value.trim();
  if(!t) return;
  try{
    await addDoc(collection(db, "mensagens"), { usuario: u.email, texto: t, data: serverTimestamp() });
    elMsg.value = "";
  } catch(e){ alert("Erro ao enviar mensagem!"); }
  };

function carregarMensagens() {
  const q = query(collection(db, "mensagens"), orderBy("data", "desc"));
  onSnapshot(q, (s) => {
    const lista = document.getElementById("listaMensagens");
    if(!lista) return;
    lista.innerHTML = "";
    s.forEach(docSnap => {
      const m = docSnap.data();
      lista.innerHTML += `<div class="p-3 bg-slate-50 rounded-xl mb-2 border-l-4 border-green-500 text-xs"><div><span class="font-bold text-green-700">${m.usuario}</span><p class="text-slate-700 mt-0.5">${m.texto}</p></div></div>`;
    });
  });
}

let streamAtual = null;
window.abrirCamera = async () => {
  const video = document.getElementById("cameraFeed");
  const placeholder = document.getElementById("cameraPlaceholder");
  if(!video || !placeholder) return;
  try {
    streamAtual = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } });
    video.srcObject = streamAtual; video.classList.remove("hidden"); placeholder.classList.add("hidden");
  } catch (err) { alert("Permita o uso da câmera!"); }
};

window.pararCamera = () => {
  if(streamAtual) {
    streamAtual.getTracks().forEach(t => t.stop());
    const video = document.getElementById("cameraFeed");
    const placeholder = document.getElementById("cameraPlaceholder");
    if(video) video.classList.add("hidden");
    if(placeholder) placeholder.classList.remove("hidden");
    streamAtual = null;
  }
};

window.mostrarNoMapa = (termoBusca) => {
  const mapa = document.getElementById("mapaIframe");
  if(mapa) mapa.src = `https://maps.google.com/maps?q=${termoBusca}&output=embed`;
  window.mudarAba('mapa');
};

async function getNyckelToken() {
  if (tokenNyckelSalvo && (Date.now() - tempoToken < 3000000)) return tokenNyckelSalvo;
  const response = await fetch('https://www.nyckel.com/connect/token', {
    method: 'POST', headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
    body: `grant_type=client_credentials&client_id=${NYCKEL_CLIENT_ID}&client_secret=${NYCKEL_CLIENT_SECRET}`
  });
  const data = await response.json();
  tokenNyckelSalvo = data.access_token; tempoToken = Date.now();
  return tokenNyckelSalvo;
}

window.scanearObjeto = async () => {
  const resultado = document.getElementById("resultadoScan");
  const video = document.getElementById("cameraFeed");
  if(!resultado || !video) return;
  resultado.classList.remove("hidden");
  resultado.innerHTML = `<div class="text-center py-6"><i class="fa-solid fa-bolt text-4xl text-green-500 mb-3 animate-bounce"></i><p class="font-semibold text-slate-700 text-xs">Analisando na nuvem...</p></div>`;
  try {
    const canvas = document.createElement("canvas");
    canvas.width = video.videoWidth; canvas.height = video.videoHeight;
    canvas.getContext("2d").drawImage(video, 0, 0);
    const blob = await new Promise(resolve => canvas.toBlob(resolve, 'image/jpeg', 0.8));
    const token = await getNyckelToken();
    const formData = new FormData(); formData.append('data', blob, 'image.jpg');
    const resposta = await fetch(`https://www.nyckel.com/v1/functions/${NYCKEL_FUNCTION_ID}/invoke`, {
      method: "POST", headers: { 'Authorization': `Bearer ${token}` }, body: formData
    });
    const dadosNyckel = await resposta.json();
    if (!dadosNyckel ||!dadosNyckel.labelName) throw new Error("Sem resposta.");
    let classeLida = dadosNyckel.labelName.toLowerCase().trim();
    let maiorClasse = classeLida;

    if(classeLida.includes("comida") || classeLida.includes("organico")) maiorClasse = "comida";
    else if(classeLida.includes("papel")) maiorClasse = "papelao";
    else if(classeLida.includes("plastico") || classeLida.includes("pet")) maiorClasse = "plastico";
    else if(classeLida.includes("vidro")) maiorClasse = "vidro";
    else if(classeLida.includes("aluminio") || classeLida.includes("metal") || classeLida.includes("lata")) maiorClasse = "aluminio";
    else if(classeLida.includes("pilha") || classeLida.includes("bateria")) maiorClasse = "pilha";

    if (maiorClasse === "fundo" || maiorClasse === "nada") {
      resultado.innerHTML = `<div class="p-4 rounded-xl bg-amber-50 text-amber-900 text-xs font-semibold text-center mt-3">⚠️ Nenhum objeto detectado. Aproxime mais!</div>`; return;
    }
    const dadosObjeto = dadosReciclagem[maiorClasse];
    if (dadosObjeto) {
      somMoeda.play().catch(e => {});
      const elXP = document.getElementById("xpUsuario");
      if(elXP) elXP.innerText = parseInt(elXP.innerText) + 50;
      historicoResiduos[maiorClasse]++;
      atualizarNivel();

      let estiloBorda = maiorClasse === "pilha"? "border-orange-500" : "border-green-500";
      let icone = maiorClasse === "pilha"? "⚠️" : "♻️";
      let corBotaoMapa = maiorClasse === "pilha"? "bg-orange-600" : "bg-emerald-600";
      let botaoMapa = dadosObjeto.buscaMapa? `<button type="button" onclick="window.mostrarNoMapa('${dadosObjeto.buscaMapa}')" class="w-full ${corBotaoMapa} text-white py-3 rounded-xl text-xs font-bold shadow-sm transition mt-2"><i class="fa-solid fa-map-location-dot"></i> Encontrar Pontos de Coleta</button>` : "";

      resultado.innerHTML = `
        <div class="space-y-3 mt-3 animate-fade-in no-print">
          <div class="p-5 rounded-xl bg-slate-50 border-l-4 ${estiloBorda} shadow-sm">
            <div class="flex items-center gap-3 mb-2"><span class="text-2xl">${icone}</span><div><h4 class="font-bold text-slate-800 text-base">${dadosObjeto.nome}</h4><span class="text-xs font-bold uppercase text-green-600">${dadosObjeto.tipo}</span></div></div>
            <p class="text-sm text-slate-600">${dadosObjeto.dica}</p>
          </div>
          ${botaoMapa}
        </div>`;
    }
  } catch (e) { alert("Erro de comunicação com a IA!"); }
};

window.analisarLinkRender = async () => {
  const elLink = document.getElementById("linkProduto");
  const resultado = document.getElementById("resultadoScan");
  if(!elLink || !resultado) return;
  const link = elLink.value.trim();
  if(!link) { alert("Cole um link primeiro!"); return; }
  resultado.classList.remove("hidden");
  resultado.innerHTML = `<div class="text-center py-6"><i class="fa-solid fa-robot text-4xl text-blue-500 mb-3 animate-pulse"></i><p class="font-semibold text-slate-700 text-xs">A Inteligência está lendo o site...</p></div>`;
  try {
    const response = await fetch("https://ecoscan-api-asjw.onrender.com/api/analisar", {
      method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ url: link })
    });
    const data = await response.json();
    if(data.sucesso) {
      somMoeda.play().catch(e => {});
      resultado.innerHTML = `
        <div class="p-5 rounded-xl bg-blue-50 border-l-4 border-blue-500 shadow-sm mt-3 animate-fade-in">
          <div class="flex items-center gap-3 mb-3"><span class="text-2xl">🤖</span><h4 class="font-bold text-blue-900 text-base">Análise da OpenAI</h4></div>
          <p class="text-sm text-slate-700 leading-relaxed whitespace-pre-wrap">${data.analise}</p>
        </div>`;
    } else { alert("Erro: " + data.erro); }
  } catch (e) { alert("Falha na comunicação!"); }
};

window.onload = function() {
    atualizarNivel();
    if (sessionStorage.getItem('bannerFechado') === 'true') {
