<!DOCTYPE html>
<html lang="pt-BR">
<head>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>

<script>
const firebaseConfig = { apiKey: "AIzaSyA0TLcy1zIAXwzgeYvmdKoqe04hPey1KXw", authDomain: "ecoscan-96a80.firebaseapp.com", projectId: "ecoscan-96a80", storageBucket: "ecoscan-96a80.appspot.com", messagingSenderId: "532877468700", appId: "1:532877468700:web:689d25217275313341abd9", measurementId: "G-ZN2B54CN07" };
firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.firestore();

const EMAIL_ADMIN = "tais.paz@live.com";
const URL_MODELO = "https://teachablemachine.withgoogle.com/models/HqIiv8XU6/";
let model, maxPredictions;

async function carregarIA() {
  try {
    model = await tmImage.load(URL_MODELO + "model.json", URL_MODELO + "metadata.json");
    maxPredictions = model.getTotalClasses();
  } catch (e) { console.error("Erro IA:", e); }
}
carregarIA();

const dicionario = {
  "organico": "comida", "fruta": "comida", "vegetal": "comida", "resto": "comida",
  "papel": "papelao", "caderno": "papelao", "caixa": "papelao",
  "garrafa": "plastico", "embalagem": "plastico",
  "pote": "vidro", "copo": "vidro",
  "lata": "aluminio", "metal": "aluminio"
};

const dadosReciclagem = {
  "comida": { nome: "Resíduo Orgânico (Comida) 🌱", tipo: "Lixeira Marrom 🟤", dica: "Perfeito para compostagem! Restos de vegetais, cascas de frutas e borra de café viram um adubo incrível." },
  "papelao": { nome: "Papelão / Papel ♻️", tipo: "Lixeira Azul 🔵", dica: "Dobre para economizar espaço e coloque na lixeira azul." },
  "plastico": { nome: "Plástico ♻️", tipo: "Lixeira Vermelha 🔴", dica: "Lave para retirar restos de comida." },
  "vidro": { nome: "Vidro ♻️", tipo: "Lixeira Verde 🟢", dica: "Cuidado ao descartar vidros quebrados, embale-os bem." },
  "aluminio": { nome: "Alumínio ♻️", tipo: "Lixeira Amarela 🟡", dica: "Amasse bem as latinhas para facilitar a reciclagem." }
};

window.scanearObjeto = async () => {
  if (!model) return;
  const video = document.getElementById("cameraFeed");
  const resultado = document.getElementById("resultadoScan");
  resultado.classList.remove("hidden");
  
  const prediction = await model.predict(video);
  let maiorClasse = prediction.sort((a,b) => b.probability - a.probability)[0].className.toLowerCase().trim();
  
  Object.keys(dicionario).forEach(key => { if(maiorClasse.includes(key)) maiorClasse = dicionario[key]; });

  const dados = dadosReciclagem[maiorClasse] || { nome: maiorClasse, tipo: "Reciclável", dica: "Descarte corretamente." };
  
  resultado.innerHTML = `
    <div class="p-5 bg-white border-l-4 border-green-500 shadow-sm mt-3 rounded-xl">
        <h4 class="font-bold text-slate-800">${dados.nome}</h4>
        <p class="text-green-600 font-bold text-xs">${dados.tipo}</p>
        <p class="text-sm text-slate-600 mt-2">${dados.dica}</p>
    </div>`;
    document.getElementById("xpUsuario").innerText = parseInt(document.getElementById("xpUsuario").innerText) + 50;
};

// Funções de Autenticação e Mural (Mantidas intactas)
window.login = () => auth.signInWithEmailAndPassword(document.getElementById("email").value, document.getElementById("senha").value).catch(e => alert("Erro"));
window.logout = () => auth.signOut();
window.mudarAba = (id) => {
    document.querySelectorAll('.aba-conteudo').forEach(a => a.classList.add('hidden'));
    document.getElementById(`aba-${id}`).classList.remove('hidden');
    if(id === 'escanear') abrirCamera();
};
window.abrirCamera = async () => {
    const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } });
    document.getElementById("cameraFeed").srcObject = stream;
    document.getElementById("cameraFeed").classList.remove("hidden");
};
</script>
<style>
.scan-frame { position: relative; width: 100%; height: 320px; border-radius: 20px; overflow: hidden; background: #000; margin: 15px 0; }
</style>
</head>
<body class="p-4 bg-green-50">
  <div class="w-full max-w-lg mx-auto bg-white rounded-3xl p-6 shadow-xl">
    <div id="loginBox">
        <h3 class="font-bold text-center mb-4">Acesse o EcoScan</h3>
        <input id="email" type="email" placeholder="E-mail" class="w-full p-3 border rounded-xl mb-2" />
        <input id="senha" type="password" placeholder="Senha" class="w-full p-3 border rounded-xl mb-4" />
        <button onclick="login()" class="w-full bg-green-600 text-white p-3 rounded-xl font-bold">Entrar</button>
    </div>
    <div id="appBox" class="hidden">
        <div class="flex gap-2 mb-4">
            <button onclick="mudarAba('escanear')" class="bg-green-600 text-white px-4 py-2 rounded-lg text-xs font-bold">Scanner</button>
            <button onclick="mudarAba('chat')" class="bg-slate-200 px-4 py-2 rounded-lg text-xs font-bold">Mural</button>
        </div>
        <div id="aba-escanear" class="aba-conteudo">
            <div class="scan-frame"><video id="cameraFeed" autoplay playsinline muted class="w-full h-full object-cover hidden"></video></div>
            <button onclick="abrirCamera()" class="w-full bg-slate-800 text-white py-3 rounded-xl text-sm font-bold">Ligar Câmera</button>
            <button onclick="scanearObjeto()" class="w-full bg-amber-500 text-white py-3 rounded-xl text-sm font-bold mt-2">Analisar</button>
            <div id="resultadoScan"></div>
        </div>
        <div id="aba-chat" class="aba-conteudo hidden">Mural de mensagens do EcoScan em breve...</div>
    </div>
  </div>
</body>
</html>
