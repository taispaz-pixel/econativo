  const elXP = document.getElementById("xpUsuario");

function atualizarRelatorioGrafico() {
  const elTotalItens = document.getElementById("relTotalItens");
  const elTotalKg = document.getElementById("relTotalKg");
  const elTotalPontos = document.getElementById("relTotalPontos");
  const elTotalImpacto = document.getElementById("relTotalImpacto");
  const elLista = document.getElementById("relatorioLista");
  if(!elTotalItens || !elTotalKg || !elTotalPontos || !elTotalImpacto || !elLista) return;

  let totalItens = 0; let totalKg = 0; let totalPontos = 0; let totalImpacto = 0;
  let htmlDetalhes = "";
  
  for (const [chave, qtd] of Object.entries(historicoResiduos)) {
    if (qtd > 0) {
      totalItens += qtd;
      let pesoTotalClass = qtd * dadosReciclagem[chave].pesoKg;
      let pontosTotalClass = qtd * dadosReciclagem[chave].pontos;
      let impactoClass = qtd * dadosReciclagem[chave].pesoImpacto;
      
      totalKg += pesoTotalClass; 
      totalPontos += pontosTotalClass;
      totalImpacto += impactoClass;
      
      htmlDetalhes += `
        <div class="flex justify-between items-center bg-white p-3 rounded-xl border border-slate-200 mb-2 shadow-sm">
          <div><p class="font-bold text-sm text-slate-800">${dadosReciclagem[chave].nome}</p><p class="text-xs text-slate-500">${qtd} items</p></div>
          <div class="text-right"><p class="font-bold text-green-700">+ ${pontosTotalClass} pts</p><p class="text-[10px] font-medium text-blue-500">↓ ${impactoClass.toFixed(2)}% imp.</p></div>
        </div>`;
    }
  }
  
  if (totalItens === 0) { htmlDetalhes = `<p class="text-xs text-center text-slate-500 italic mt-4">Ainda sem dados cadastrados.</p>`; }
  
  if(elTotalItens) elTotalItens.innerText = totalItens;
  if(elTotalKg) elTotalKg.innerText = totalKg.toFixed(2) + " kg";
  if(elTotalPontos) elTotalPontos.innerText = totalPontos + " pts";
  if(elTotalImpacto) elTotalImpacto.innerText = "↓ " + totalImpacto.toFixed(2) + "%";
  if(elLista) elLista.innerHTML = htmlDetalhes;
}

async function buscarAvaliacoes(dias = 0) {
  const u = auth.currentUser;
  if(!u) return [];
  const dataLimite = new Date();
  dataLimite.setDate(dataLimite.getDate() - dias);
  const q = query(collection(db, "avaliacoes_app"), where("usuario", "==", u.email), where("data", ">=", dataLimite));
  const querySnapshot = await getDocs(q);
  const avaliacoes = [];
  querySnapshot.forEach((doc) => { avaliacoes.push({id: doc.id, ...doc.data()}); });
  return avaliacoes;
}

// --- FUNÇÃO AUXILIAR PARA BUSCAR E CONSOLIDAR DADOS REAIS DO BANCO ---
async function buscarHistoricoPeriodo(dias) {
  const u = auth.currentUser;
  if (!u) return [["Nenhum dado registrado no período", "-", "-", "-", "-"]];
  try {
    const q = query(collection(db, "historico_residuos"), where("usuario", "==", u.email));
    const querySnapshot = await getDocs(q);
    let contagem = { comida: 0, papelao: 0, plastico: 0, vidro: 0, aluminio: 0, pilha: 0 };
    const agora = Date.now();
    const limiteMilissegundos = dias * 24 * 60 * 60 * 1000;

    querySnapshot.forEach((doc) => {
      const item = doc.data();
      if (dias > 0) {
        const dataItem = item.data?.toDate ? item.data.toDate().getTime() : null;
        if (dataItem && (agora - dataItem > limiteMilissegundos)) {
          return;
        }
      }
      if (contagem[item.material] !== undefined) {
        contagem[item.material]++;
      }
    });

    let linhas = [];
    for (const [chave, qtd] of Object.entries(contagem)) {
      if (qtd > 0) {
        let pts = qtd * dadosReciclagem[chave].pontos;
        let kg = qtd * dadosReciclagem[chave].pesoKg;
        linhas.push([
          dadosReciclagem[chave].nome,
          `${qtd} un`,
          `${kg.toFixed(3).replace('.', ',')} kg`,
          `+${pts} pts`,
          dadosReciclagem[chave].tipo
        ]);
      }
    }
    if (linhas.length === 0) {
      linhas.push(["Nenhum dado registrado no período", "-", "-", "-", "-"]);
    }
    return linhas;
  } catch (err) {
    console.error("Erro ao buscar histórico:", err);
    return [["Erro ao carregar dados do banco", "-", "-", "-", "-"]];
  }
}

let unsubHistorico = null;

onAuthStateChanged(auth, (u) => {
  const loginBox = document.getElementById("loginBox");
  const appContainer = document.getElementById("appContainer");
  const usuarioEl = document.getElementById("usuario");
  if(!loginBox || !appContainer || !usuarioEl) return;

  if (u) {
    loginBox.classList.add("hidden");
    appContainer.classList.remove("hidden");
    usuarioEl.innerText = u.email;
    carregarMensagens();

    const q = query(collection(db, "historico_residuos"), where("usuario", "==", u.email));
    unsubHistorico = onSnapshot(q, (snap) => {
      historicoResiduos = { comida: 0, papelao: 0, plastico: 0, vidro: 0, aluminio: 0, pilha: 0 };
      snap.forEach((doc) => {
        const item = doc.data();
        if (historicoResiduos[item.material] !== undefined) {
          historicoResiduos[item.material]++;
        }
      });
      
      let totalItens = Object.values(historicoResiduos).reduce((a, b) => a + b, 0);
      const elXP = document.getElementById("xpUsuario");
      if (elXP) elXP.innerText = 150 + (totalItens * 50);
      
      atualizarNivel();
      atualizarRelatorioGrafico();
    });

  } else {
    loginBox.classList.remove("hidden");
    appContainer.classList.add("hidden");
    if(window.pararCamera) window.pararCamera();
    if(unsubHistorico) {
      unsubHistorico();
      unsubHistorico = null;
    }
  }
});

let streamAtual = null;
window.abrirCamera = async () => {
  const video = document.getElementById("cameraFeed");
  const placeholder = document.getElementById("cameraPlaceholder");
  if(!video || !placeholder) return;
  try {
    streamAtual = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } });
    video.srcObject = streamAtual; 
    video.classList.remove("hidden"); 
    placeholder.classList.add("hidden");
  } catch (err) { 
    alert("Para analisar resíduos, você precisa permitir o uso da câmera."); 
  }
};

window.pararCamera = () => {
  if(streamAtual) {
    streamAtual.getTracks().forEach(t => t.stop());
    const video = document.getElementById("cameraFeed");
    const placeholder = document.getElementById("cameraPlaceholder");
    if(video) { video.srcObject = null; video.classList.add("hidden"); }
    if(placeholder) placeholder.classList.remove("hidden");
    streamAtual = null;
  }
};

// ==========================================
// 🚀 IA: CACHE E PROTEÇÃO CONTRA TELA PRETA 
// ==========================================
async function getNyckelToken() {
  if (tokenNyckelSalvo && (Date.now() - tempoToken < 3000000)) return tokenNyckelSalvo;
  try {
    const response = await fetch('https://www.nyckel.com/connect/token', {
      method: 'POST', headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
      body: `grant_type=client_credentials&client_id=${NYCKEL_CLIENT_ID}&client_secret=${NYCKEL_CLIENT_SECRET}`
    });
    if (!response.ok) throw new Error("Falha na autenticação da IA.");
    const data = await response.json();
    tokenNyckelSalvo = data.access_token; tempoToken = Date.now();
    return tokenNyckelSalvo;
  } catch (erro) { throw new Error(erro.message); }
}

window.scanearObjeto = async () => {
  const resultado = document.getElementById("resultadoScan");
  const video = document.getElementById("cameraFeed");
  if(!resultado || !video) return;

  if (!video.srcObject || video.videoWidth === 0 || video.classList.contains("hidden")) {
    alert("⚠️ Opa! Você precisa ligar a câmera primeiro e apontar para um objeto.");
    return;
  }

  resultado.classList.remove("hidden");
  resultado.innerHTML = `<div class="text-center py-6"><i class="fa-solid fa-bolt text-4xl text-green-500 mb-3 animate-bounce"></i><p class="font-semibold text-slate-700 text-xs">Analisando inteligência na nuvem...</p></div>`;
  
  try {
    const canvas = document.createElement("canvas");
    canvas.width = video.videoWidth; canvas.height = video.videoHeight;
    canvas.getContext("2d").drawImage(video, 0, 0);
    const blob = await new Promise(resolve => canvas.toBlob(resolve, 'image/jpeg', 0.8));
    if(!blob) throw new Error("Falha ao capturar o frame da câmera.");

    const token = await getNyckelToken();
    const formData = new FormData(); formData.append('data', blob, 'image.jpg');
    
    const resposta = await fetch(`https://www.nyckel.com/v1/functions/${NYCKEL_FUNCTION_ID}/invoke`, {
      method: "POST", headers: { 'Authorization': `Bearer ${token}` }, body: formData
    });
    
    if(!resposta.ok) {
        let msg = await resposta.text();
        throw new Error(`Servidor rejeitou a requisição. Limite atingido? Detalhe: ${msg}`);
    }
    
    const dadosNyckel = await resposta.json();
    if (!dadosNyckel ||!dadosNyckel.labelName) throw new Error("O objeto não foi reconhecido.");
    
    let classeLida = dadosNyckel.labelName.toLowerCase().trim();
    let maiorClasse = classeLida;

    if(classeLida.includes("comida") || classeLida.includes("organico")) maiorClasse = "comida";
    else if(classeLida.includes("papel")) maiorClasse = "papelao";
    else if(classeLida.includes("plastico") || classeLida.includes("pet")) maiorClasse = "plastico";
    else if(classeLida.includes("vidro")) maiorClasse = "vidro";
    else if(classeLida.includes("aluminio") || classeLida.includes("metal") || classeLida.includes("lata")) maiorClasse = "aluminio";
    else if(classeLida.includes("pilha") || classeLida.includes("bateria")) maiorClasse = "pilha";

    if (maiorClasse === "fundo" || maiorClasse === "nada") {
      resultado.innerHTML = `<div class="p-4 rounded-xl bg-amber-50 text-amber-900 text-xs font-semibold text-center mt-3">⚠️ Nenhum objeto claro detectado. Centralize o resíduo e tente novamente.</div>`; return;
    }
    
    const dadosObjeto = dadosReciclagem[maiorClasse];
    if (dadosObjeto) {
      somMoeda.play().catch(e => {});
      
      const u = auth.currentUser;
      if (u) {
        await addDoc(collection(db, "historico_residuos"), {
          usuario: u.email,
          material: maiorClasse,
          data: serverTimestamp()
        });
      }

      let estiloBorda = maiorClasse === "pilha"? "border-orange-500" : "border-green-500";
      let icone = maiorClasse === "pilha"? "⚠️" : "♻️";
      let corBotaoMapa = maiorClasse === "pilha"? "bg-orange-600" : "bg-emerald-600";
      
      let termoBusca = maiorClasse === "pilha" ? "posto de coleta de pilhas e Baterias" : "pontos de reciclagem de " + maiorClasse;
      
      let urlMaps = `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(termoBusca)}`;

      let botaoMapa = dadosObjeto.buscaMapa ? `<button type="button" onclick="window.open('${urlMaps}', '_blank')" class="w-full ${corBotaoMapa} text-white py-3 rounded-xl text-xs font-bold shadow-sm transition mt-2"><i class="fa-solid fa-map-location-dot"></i> Encontrar Pontos de Coleta</button>` : "";

      resultado.innerHTML = `
        <div class="space-y-3 mt-3 animate-fade-in no-print">
          <div class="p-5 rounded-xl bg-slate-50 border-l-4 ${estiloBorda} shadow-sm">
            <div class="flex items-center gap-3 mb-2"><span class="text-2xl">${icone}</span><div><h4 class="font-bold text-slate-800 text-base">${dadosObjeto.nome}</h4><span class="text-xs font-bold uppercase text-green-600">${dadosObjeto.tipo}</span></div></div>
            <p class="text-sm text-slate-600">${dadosObjeto.dica}</p>
          </div>
          ${botaoMapa}
        </div>`;
    } else {
      resultado.innerHTML = `
        <div class="p-4 rounded-xl bg-amber-50 text-amber-900 text-xs font-semibold text-center mt-3 border border-amber-200">
          ⚠️ O objeto foi reconhecido pela IA como "<b>${dadosNyckel.labelName}</b>", mas ainda não temos uma categoria de reciclagem cadastrada para ele.
        </div>`;
    }
  } catch (e) { 
    console.error("ERRO SCAN:", e);
    resultado.innerHTML = `<div class="p-4 rounded-xl bg-red-50 text-red-900 text-xs font-semibold text-center mt-3">❌ Erro de processamento:<br>${e.message}</div>`; 
  }
};

                  <option>1 Estrela</option>
                </select>
                <select id="catAvaliacao" onchange="atualizarSubCategorias()" class="dark-input text-xs">
                    <option value="Boa">Boa</option>
                    <option value="Ruim">Ruim</option>
                    <option value="Superou">Superou</option>
                </select>
                <div id="subCategoriasContainer"></div>
                
                <button onclick="salvarFeedback()" class="w-full bg-purple-600 text-white font-bold py-3 mt-4 rounded-xl">Enviar Feedback</button>
                
                <div class="grid grid-cols-3 gap-2 mt-2">
                    <button onclick="imprimirAvaliacaoHoje()" class="bg-white text-slate-900 py-3 rounded-xl font-bold text-[10px]">Hoje</button>
                    <button onclick="imprimirAvaliacao15Dias()" class="bg-white text-slate-900 py-3 rounded-xl font-bold text-[10px]">15 Dias</button>
                    <button onclick="imprimirAvaliacao30Dias()" class="bg-white text-slate-900 py-3 rounded-xl font-bold text-[10px]">30 Dias</button>
                </div>
            </div>
        </div>

        <div id="aba-mural" class="aba-conteudo hidden flex flex-col h-[380px]">
          <h3 class="font-bold text-sm text-slate-700 mb-2">💬 EcoMural Coletivo</h3>
          <div id="listaMensagens" class="flex-1 overflow-y-auto bg-slate-50 rounded-xl p-3 mb-2 border border-slate-200"></div>
          <div class="flex gap-2">
            <input id="novaMensagem" type="text" placeholder="Escreva aqui..." class="flex-1 p-3 border rounded-xl text-sm" />
            <button type="button" onclick="enviarMensagem()" class="bg-green-600 text-white px-4 rounded-xl"><i class="fa-solid fa-paper-plane"></i></button>
          </div>
        </div>

      </div>
    </div>
  </div>
</div>

</body>
</html>
