const EMAIL_ADMIN = "tais.paz@live.com";

// =================================================================

/* =======================================================
   📚 BANCO DE DADOS (Sinônimos + Curiosidades)
======================================================= */
const dadosReciclagem = {
  "comida": {
    nome: "Resíduo Orgânico (Comida) 🌱",
    tipo: "Lixeira Marrom 🟤",
    dica: "Descarte na lixeira de resíduos orgânicos ou reserve para a compostagem caseira.",
    sinonimos: "Restos de refeições, cascas, borra de café, saquinhos de chá, cascas de ovos.",
    curiosidade: "Compostar o lixo orgânico pode reduzir o volume de lixo da sua casa em até 50%!"
  },
  "papelao": {

    tipo: "Lixeira Azul 🔵",
    dica: "Incrível! Esvazie todo o conteúdo e desmonte ou dobre a caixa para economizar espaço.",
    sinonimos: "Caixas de sapato, revistas, jornais, panfletos, papel sulfite, embalagens.",

  },
  "plastico": {

    sinonimos: "Garrafas PET, potes de margarina, sacolas plásticas, copos descartáveis.",

  },
  "vidro": {

    tipo: "Lixeira Verde 🟢",
    dica: "Retire tampas antes. Se estiver quebrado, embale em jornal para proteger os coletores.",
    sinonimos: "Garrafas de bebida, potes de geleia, copos de vidro, frascos de perfume.",

  },

    curiosidade: "Reciclar 1 única latinha economiza energia suficiente para manter uma TV ligada por 3 horas!"
  }
};

const mensagensAgradecimento = [
  "O planeta agradece imensamente o seu cuidado! 🌱",
  "Você está ajudando a reduzir o lixo no mundo! 🌍✨",
  "Reciclar protege nossa biodiversidade! 🌲",
  "O EcoScan se orgulha de você! 🎉"
];

const somMoeda = new Audio("https://assets.mixkit.co/active_storage/sfx/2013/2013-preview.mp3");

function atualizarNivel() {
  const xp = parseInt(document.getElementById("xpUsuario").innerText);
  let titulo = "Iniciante Verde 🌱";
  let cor = "text-green-200";

  if (xp >= 200 && xp < 500) { titulo = "Defensor Eco 🌿"; cor = "text-emerald-300"; }
  else if (xp >= 500 && xp < 1000) { titulo = "Guardião da Natureza 🌳"; cor = "text-yellow-300"; }
  else if (xp >= 1000) { titulo = "Mestre Sustentável 🌍"; cor = "text-amber-400"; }

  const elementoTitulo = document.getElementById("tituloUsuario");
  elementoTitulo.innerText = titulo;
  elementoTitulo.className = `text-[10px] font-black uppercase tracking-wider ${cor}`;
}

/* =======================================================
   📷 CONTROLE DA CÂMERA DO CELULAR
======================================================= */
let streamAtual = null;

window.abrirCamera = async () => {
  const video = document.getElementById("cameraFeed");
  const placeholder = document.getElementById("cameraPlaceholder");
  try {
    streamAtual = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } });
    video.srcObject = streamAtual;
    video.classList.remove("hidden");
    placeholder.classList.add("hidden");
  } catch (err) {
    mostrarAviso("Permita a câmera nas configurações.", "erro");
  }
};

window.pararCamera = () => {
  if(streamAtual) {
    streamAtual.getTracks().forEach(t => t.stop());
    document.getElementById("cameraFeed").classList.add("hidden");
    document.getElementById("cameraPlaceholder").classList.remove("hidden");
    streamAtual = null;
  }
};

/* =======================================================
   🔍 PROCESSAMENTO DA IA (NYCKEL API)
======================================================= */
async function getNyckelToken() {
  const response = await fetch('https://www.nyckel.com/connect/token', {
    method: 'POST',
    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
    body: `grant_type=client_credentials&client_id=${NYCKEL_CLIENT_ID}&client_secret=${NYCKEL_CLIENT_SECRET}`
  });
  const data = await response.json();
  return data.access_token;
}

window.scanearObjeto = async () => {
  const resultado = document.getElementById("resultadoScan");
  resultado.classList.remove("hidden");
  resultado.innerHTML = `
    <div class="text-center py-6">
      <i class="fa-solid fa-bolt text-4xl text-green-500 mb-3 animate-bounce"></i>
      <p class="font-semibold text-slate-700 text-xs">Nyckel processando imagem na nuvem...</p>
    </div>
  `;

  const video = document.getElementById("cameraFeed");
  
  try {
    // Tira uma foto invisível do vídeo
    const canvas = document.createElement("canvas");
    canvas.width = video.videoWidth;
    canvas.height = video.videoHeight;
    canvas.getContext("2d").drawImage(video, 0, 0);

    const blob = await new Promise(resolve => canvas.toBlob(resolve, 'image/jpeg', 0.8));
    
    // Obtém a chave de acesso rápida e envia a foto para o Nyckel
    const token = await getNyckelToken();
    const formData = new FormData();
    formData.append('data', blob, 'image.jpg');

    const resposta = await fetch(`https://www.nyckel.com/v1/functions/${NYCKEL_FUNCTION_ID}/invoke`, {
      method: "POST",
      headers: { 'Authorization': `Bearer ${token}` },
      body: formData
    });

    const dadosNyckel = await resposta.json();

    if (!dadosNyckel || !dadosNyckel.labelName) {
      throw new Error("O Nyckel não devolveu nenhuma resposta reconhecível.");
    }

    let classeLida = dadosNyckel.labelName.toLowerCase().trim();
    let maiorClasse = classeLida;

    // Traduz o nome da categoria do Nyckel para o nosso banco de dados
    if(classeLida.includes("comida") || classeLida.includes("organico") || classeLida.includes("orgânico")) maiorClasse = "comida";
    else if(classeLida.includes("papel")) maiorClasse = "papelao";
    else if(classeLida.includes("plastico") || classeLida.includes("pet")) maiorClasse = "plastico";
    else if(classeLida.includes("vidro")) maiorClasse = "vidro";
    else if(classeLida.includes("aluminio") || classeLida.includes("metal") || classeLida.includes("lata")) maiorClasse = "aluminio";

    // Se for lido como Fundo
    if (maiorClasse === "fundo" || maiorClasse === "nada" || maiorClasse === "background") {
      resultado.innerHTML = `
        <div class="p-4 rounded-xl bg-amber-50 border border-amber-200 text-amber-900 text-xs font-semibold mt-3 text-center">
          ⚠️ Nenhum objeto detectado com clareza. Aproxime mais da câmera!
        </div>
      `;
      return;
    }

    const dadosObjeto = dadosReciclagem[maiorClasse];

    if (dadosObjeto) {
      const agradecimento = mensagensAgradecimento[Math.floor(Math.random() * mensagensAgradecimento.length)];
      somMoeda.play().catch(e => console.log("Som bloqueado pelo navegador."));

      document.getElementById("xpUsuario").innerText = parseInt(document.getElementById("xpUsuario").innerText) + 50;
      atualizarNivel();

      let extraCompostagem = "";
      if (maiorClasse === "comida") {
        extraCompostagem = `
          <div class="p-4 rounded-xl bg-amber-50 border-l-4 border-amber-500 shadow-sm mt-3 animate-fade-in">
            <h5 class="font-bold text-amber-900 text-sm mb-1 flex items-center gap-1"><i class="fa-solid fa-leaf"></i> Guia de Compostagem</h5>
            <ul class="text-[11px] text-amber-900 space-y-1">
              <li><strong>✅ PODE:</strong> Cascas, folhas, borra de café, ovos.</li>
              <li><strong>❌ NÃO PODE:</strong> Carnes, laticínios, óleos, ossos.</li>
            </ul>
          </div>
        `;
      }

      resultado.innerHTML = `
        <div class="space-y-3 mt-3 animate-fade-in">
          <div class="p-5 rounded-xl bg-slate-50 border-l-4 border-green-500 shadow-sm">
            <div class="flex items-center gap-3 mb-2">
              <span class="text-2xl">♻️</span>
              <div>
                <h4 class="font-bold text-slate-800 text-base">${dadosObjeto.nome}</h4>
                <span class="text-xs font-bold uppercase text-green-600 tracking-wider">${dadosObjeto.tipo}</span>
              </div>
            </div>
            <p class="text-sm text-slate-600 leading-relaxed">${dadosObjeto.dica}</p>
            
            <div class="mt-3 pt-3 border-t border-slate-200">
              <p class="text-[11px] text-slate-500 leading-relaxed"><strong class="text-slate-600">Sinônimos:</strong> ${dadosObjeto.sinonimos}</p>
            </div>
          </div>

          <div class="p-4 rounded-xl bg-blue-50 border border-blue-200 shadow-sm">
            <p class="text-[11px] font-bold text-blue-800 uppercase mb-1">💡 Curiosidade de Impacto</p>
            <p class="text-xs text-blue-900">${dadosObjeto.curiosidade}</p>
          </div>

          ${extraCompostagem}

          <div class="p-4 rounded-xl bg-green-50 border border-green-200 text-green-800 shadow-sm text-xs font-medium flex gap-2 items-start">
            <span class="text-lg">💖</span>
            <div><p class="font-bold mb-0.5">+50 XP Ganho!</p><p class="opacity-90">${agradecimento}</p></div>
          </div>
          
          <p class="text-[10px] text-slate-400 text-center mt-2">Identificação Nyckel: ${dadosNyckel.labelName}</p>
        </div>
      `;

    } else {
      resultado.innerHTML = `
        <div class="p-4 rounded-xl bg-slate-100 text-slate-700 text-xs text-center mt-3">
          Objeto lido pelo Nyckel: <strong>${dadosNyckel.labelName}</strong>. 
          <br>Certifique-se de que a categoria cadastrada lá seja papelao, plastico, vidro, aluminio ou comida.
        </div>
      `;
    }

  } catch (e) {
    console.error(e);
    mostrarAviso("Erro na comunicação com o servidor do Nyckel. Tente novamente.", "erro");
  }
};

/* =======================================================
   MURAL, LOGINS E NAVEGAÇÃO
======================================================= */
window.login = async () => {
  const e = document.getElementById("email").value.trim(); const s = document.getElementById("senha").value;
  if(!e||!s){ mostrarAviso("Preencha e-mail e senha","erro"); return; }
  try{ await signInWithEmailAndPassword(auth,e,s); mostrarAviso("Bem-vinda de volta! 🎉","sucesso"); }catch(err){ mostrarAviso("Usuário ou senha incorretos","erro"); }
};
window.registrar = async () => {
  const e = document.getElementById("email").value.trim(); const s = document.getElementById("senha").value;
  if(!e||!s||s.length<6){ mostrarAviso("E-mail válido e senha mínima de 6 caracteres.","erro"); return; }
  try{ await createUserWithEmailAndPassword(auth,e,s); mostrarAviso("Conta ativada com sucesso! 🎉","sucesso"); }catch(err){ mostrarAviso("Erro ao realizar cadastro","erro"); }
};
window.logout = async () => { await signOut(auth); mostrarAviso("Sessão encerrada","info"); };

onAuthStateChanged(auth, (u) => {
  if (u) { document.getElementById("loginBox").classList.add("hidden"); document.getElementById("appBox").classList.remove("hidden"); document.getElementById("usuario").innerText = u.email; carregarMensagens(); atualizarNivel(); }
  else { document.getElementById("loginBox").classList.remove("hidden"); document.getElementById("appBox").classList.add("hidden"); pararCamera(); }
});

window.enviarMensagem = async () => {
  const t = document.getElementById("novaMensagem").value.trim(); const u = auth.currentUser;
  if(!u||!t) return;
  if(termosProibidos.some(p => t.toLowerCase().includes(p))){ mostrarAviso("Mensagem bloqueada por violar os termos! ⚠️","erro"); document.getElementById("novaMensagem").value=""; return; }
  try{ await addDoc(collection(db, "mensagens"), { usuario: u.email, texto: t, data: serverTimestamp() }); document.getElementById("novaMensagem").value = ""; }catch(e){}
};

window.deletarMensagem = async (id) => { if(confirm("Deseja deletar?")){ try{ await deleteDoc(doc(db,"mensagens",id)); }catch(e){} } };

function carregarMensagens() {
  const q = query(collection(db, "mensagens"), orderBy("data", "desc"));
  onSnapshot(q, (s) => {
    const lista = document.getElementById("listaMensagens"); if(!lista) return; lista.innerHTML = "";
    const mail = auth.currentUser?.email;
    s.forEach(docSnap => {
      const m = docSnap.data(); const btn = mail === EMAIL_ADMIN ? `<button onclick="deletarMensagem('${docSnap.id}')" class="text-red-500 text-[10px] px-2 py-0.5 bg-red-50 rounded border border-red-200 font-bold"><i class="fa-solid fa-trash"></i></button>` : "";
      lista.innerHTML += `<div class="p-3 bg-slate-50 rounded-xl mb-2 border-l-4 border-green-500 shadow-sm flex justify-between items-center"><div><span class="font-bold text-xs text-green-700">${m.usuario}</span><p class="text-sm text-slate-700 mt-0.5">${m.texto}</p></div>${btn}</div>`;
    });
  });
}

function mostrarAviso(t, tipo) {
  const a = document.getElementById("aviso"); a.className = `p-3 mb-4 rounded-xl text-sm font-medium ${tipo==='sucesso'?'bg-green-100 text-green-800':tipo==='erro'?'bg-red-100 text-red-800':'bg-blue-100 text-blue-800'}`;
  a.innerText = t; a.classList.remove("hidden"); setTimeout(() => a.classList.add("hidden"), 3500);
}

window.mudarAba = (nome) => {
  document.querySelectorAll(".aba-conteudo").forEach(el => el.classList.add("hidden"));
  document.querySelectorAll(".aba-btn").forEach(el => el.classList.remove("bg-green-600", "text-white"));
  document.getElementById(`aba-${nome}`).classList.remove("hidden");
  event.target.classList.add("bg-green-600", "text-white");
  if(nome === "escanear") abrirCamera(); else pararCamera();
};

window.onload = atualizarNivel;
</script>

<style>
* { -webkit-tap-highlight-color: transparent; box-sizing: border-box; }
body{ margin:0; padding:0; font-family: 'Arial', sans-serif; background: linear-gradient(135deg, #f0fdf4 0%, #dcfce7 100%); min-height: 100vh; }
.card{ background:white; border-radius:28px; padding:24px; box-shadow: 0 8px 32px rgba(22, 163, 74, 0.12); border: 1px solid rgba(22, 163, 74, 0.08); }
.topo{ background:linear-gradient(135deg, #16a34a 0%, #15803d 100%); border-radius:24px; padding:20px; color:white; margin-bottom:20px; box-shadow: 0 4px 12px rgba(21, 128, 61, 0.2); }
.scan-frame { position: relative; width: 100%; height: 320px; border-radius: 20px; overflow: hidden; background: #000; margin: 15px 0; }
.scan-line { position: absolute; width: 100%; height: 3px; background: #4ade80; box-shadow: 0 0 8px #4ade80; animation: scan 2s linear infinite; z-index: 10; }
@keyframes scan{ 0% { top: 0%; } 50% { top: 100%; } 100% { top: 0%; } }
</style>
</head>

<body class="p-4">
<div class="w-full max-w-lg mx-auto">
  <div id="aviso" class="hidden p-3 mb-4 rounded-xl text-sm font-medium"></div>

  <div class="card">
    <div class="topo">
      <h1 class="text-2xl font-black flex items-center gap-2">🌱 EcoScan</h1>
      <p id="tituloUsuario" class="mt-1 text-[10px] font-black uppercase tracking-wider text-green-200">Iniciante Verde 🌱</p>
      <div class="mt-4 flex justify-between items-center text-xs font-bold border-t border-green-500/30 pt-3">
        <span>Progresso Eco:</span>
        <span class="bg-white/20 px-3 py-1 rounded-full border border-white/30 shadow-inner">XP: <span id="xpUsuario">150</span></span>
      </div>
    </div>

    <div id="loginBox" class="space-y-4">
      <h3 class="text-lg font-bold text-slate-700 text-center mb-3">Acesse sua Conta</h3>
      <input id="email" type="email" placeholder="📧 Digite seu e-mail" class="w-full p-4 bg-slate-50 border border-slate-200 rounded-xl text-base focus:outline-none focus:ring-2 focus:ring-green-500" />
      <input id="senha" type="password" placeholder="🔒 Digite sua senha" class="w-full p-4 bg-slate-50 border border-slate-200 rounded-xl text-base focus:outline-none focus:ring-2 focus:ring-green-500" />
      <div class="grid grid-cols-2 gap-3 pt-2">
        <button onclick="login()" class="bg-green-600 text-white p-4 rounded-xl font-bold text-base active:scale-95">Entrar</button>
        <button onclick="registrar()" class="bg-slate-900 text-white p-4 rounded-xl font-bold text-base active:scale-95">Criar Conta</button>
      </div>
    </div>

    <div id="appBox" class="hidden space-y-4">
      <div class="flex justify-between items-center bg-green-50 p-3 rounded-xl text-xs border border-green-100">
        <span class="text-slate-600 font-medium">👤 <span id="usuario"></span></span>
        <button onclick="logout()" class="text-red-600 font-bold hover:underline">Sair</button>
      </div>

      <div class="grid grid-cols-3 gap-1 bg-slate-100 p-1 rounded-xl">
        <button onclick="mudarAba('escanear')" class="aba-btn py-2.5 rounded-lg text-xs font-bold text-slate-600 bg-green-600 text-white">📷 Scanner</button>
        <button onclick="mudarAba('mapa')" class="aba-btn py-2.5 rounded-lg text-xs font-bold text-slate-600">📍 Mapa</button>
        <button onclick="mudarAba('chat')" class="aba-btn py-2.5 rounded-lg text-xs font-bold text-slate-600">💬 Mural</button>
      </div>

      <div id="aba-escanear" class="aba-conteudo space-y-3">
        <div class="scan-frame">
          <video id="cameraFeed" autoplay playsinline muted class="w-full h-full object-cover hidden"></video>
          <div id="cameraPlaceholder" class="absolute inset-0 bg-gradient-to-b from-slate-900 to-black flex flex-col items-center justify-center text-white">
            <i class="fa-solid fa-camera text-4xl opacity-20 mb-2"></i>
            <p class="text-xs opacity-40">Câmera aguardando ativação</p>
          </div>
          <div class="scan-line"></div>
        </div>
        <div class="grid grid-cols-2 gap-2">
          <button onclick="abrirCamera()" class="bg-green-600 text-white py-3 rounded-xl text-sm font-bold active:scale-95">📷 Ligar Câmera</button>
          <button onclick="scanearObjeto()" class="bg-amber-500 text-white py-3 rounded-xl text-sm font-bold active:scale-95">🔍 Analisar</button>
        </div>
        <div id="resultadoScan" class="hidden"></div>
      </div>

      <div id="aba-mapa" class="aba-conteudo hidden space-y-2">
        <h3 class="font-bold text-sm text-slate-700">📍 Postos de Reciclagem</h3>
        <div class="w-full h-60 bg-slate-100 rounded-xl overflow-hidden border border-slate-200">
          <iframe class="w-full h-full border-none" src="https://maps.google.com/maps?q=postos%20de%20reciclagem&t=&z=13&ie=UTF8&iwloc=&output=embed"></iframe>
        </div>
      </div>

      <div id="aba-chat" class="aba-conteudo hidden flex flex-col h-[380px]">
        <h3 class="font-bold text-sm text-slate-700 mb-2">💬 EcoMural Coletivo</h3>
        <div id="listaMensagens" class="flex-1 overflow-y-auto bg-slate-50 border border-slate-100 rounded-xl p-3 mb-2"></div>
        <div class="flex gap-2">
          <input id="novaMensagem" type="text" placeholder="Compartilhe uma dica..." class="flex-1 p-3 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-green-500" />
          <button onclick="enviarMensagem()" class="bg-green-600 text-white px-4 rounded-xl font-bold"><i class="fa-solid fa-paper-plane"></i></button>
        </div>
      </div>

    </div>
  </div>
</div>
</body>
</html>
