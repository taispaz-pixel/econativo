function atualizarNivel() {
  const xp = parseInt(document.getElementById("xpUsuario").innerText);
  let titulo = "Iniciante Verde 🌱"; let cor = "text-green-200";
  if (xp >= 200 && xp < 500) { titulo = "Defensor Eco 🌿"; cor = "text-emerald-300"; }
  else if (xp >= 500 && xp < 1000) { titulo = "Guardião da Natureza 🌳"; cor = "text-yellow-300"; }
  else if (xp >= 1000) { titulo = "Mestre Sustentável 🌍"; cor = "text-amber-400"; }
  document.getElementById("tituloUsuario").innerText = titulo;
  document.getElementById("tituloUsuario").className = `mt-1 text-[10px] font-black uppercase tracking-wider ${cor}`;
  atualizarRelatorioGrafico();
}

function atualizarRelatorioGrafico() {
  let totalItens = 0; let totalKg = 0; let totalPontos = 0; let totalImpacto = 0;
  let htmlDetalhes = "";
  for (const [chave, qtd] of Object.entries(historicoResiduos)) {
    if (qtd > 0) {
      totalItens += qtd;
      let pesoTotalClass = qtd * dadosReciclagem[chave].pesoKg;
      let pontosTotalClass = qtd * dadosReciclagem[chave].pontos;
      let impactoClass = qtd * dadosReciclagem[chave].pesoImpacto;
      totalKg += pesoTotalClass; totalPontos += pontosTotalClass; totalImpacto += impactoClass;
      htmlDetalhes += `<div class="flex justify-between items-center bg-white p-3 rounded-xl border border-slate-200 mb-2 shadow-sm"><div><p class="font-bold text-sm text-slate-800">${dadosReciclagem[chave].nome}</p><p class="text-xs text-slate-500">${qtd} itens</p></div><div class="text-right"><p class="font-bold text-green-700">+ ${pontosTotalClass} pts</p><p class="text-[10px] font-medium text-blue-500">↓ ${impactoClass.toFixed(2)}% imp.</p></div></div>`;
    }
  }
  if (totalItens === 0) { htmlDetalhes = `<p class="text-xs text-center text-slate-500 italic mt-4">Nenhum dado gerado ainda.</p>`; }
  document.getElementById("relTotalItens").innerText = totalItens;
  document.getElementById("relTotalKg").innerText = totalKg.toFixed(2) + " kg";
  document.getElementById("relTotalPontos").innerText = totalPontos + " pts";
  document.getElementById("relTotalImpacto").innerText = "↓ " + totalImpacto.toFixed(2) + "%";
  document.getElementById("relatorioLista").innerHTML = htmlDetalhes;
}

// --- IA OTIMIZADA (CURATIVO DE VELOCIDADE APLICADO) ---
let tokenNyckelSalvo = null;
let tempoToken = 0;

async function getNyckelToken() {
  if (tokenNyckelSalvo && (Date.now() - tempoToken < 3000000)) return tokenNyckelSalvo;
  const response = await fetch('https://www.nyckel.com/connect/token', {
    method: 'POST', headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
    body: `grant_type=client_credentials&client_id=${NYCKEL_CLIENT_ID}&client_secret=${NYCKEL_CLIENT_SECRET}`
  });
  const data = await response.json();
  tokenNyckelSalvo = data.access_token;
  tempoToken = Date.now();
  return tokenNyckelSalvo;
}

window.scanearObjeto = async () => {
  const resultado = document.getElementById("resultadoScan");
  resultado.classList.remove("hidden");
  resultado.innerHTML = `<div class="text-center py-6"><i class="fa-solid fa-bolt text-4xl text-green-500 mb-3 animate-bounce"></i><p class="font-semibold text-slate-700 text-xs">Analisando...</p></div>`;
  const video = document.getElementById("cameraFeed");
  try {
    const canvas = document.createElement("canvas");
    canvas.width = video.videoWidth; canvas.height = video.videoHeight;
    canvas.getContext("2d").drawImage(video, 0, 0);
    const blob = await new Promise(resolve => canvas.toBlob(resolve, 'image/jpeg', 0.8));
    const token = await getNyckelToken();
    const formData = new FormData(); formData.append('data', blob, 'image.jpg');
    const resposta = await fetch(`https://www.nyckel.com/v1/functions/${NYCKEL_FUNCTION_ID}/invoke`, {
      method: "POST", headers: { 'Authorization': `Bearer ${token}` }, body: formData
    });
    const dadosNyckel = await resposta.json();
    if (!dadosNyckel ||!dadosNyckel.labelName) throw new Error("Sem resposta.");
    let classeLida = dadosNyckel.labelName.toLowerCase().trim();
    let maiorClasse = classeLida;
    if(classeLida.includes("comida")) maiorClasse = "comida";
    else if(classeLida.includes("papel")) maiorClasse = "papelao";
    else if(classeLida.includes("plastico")) maiorClasse = "plastico";
    else if(classeLida.includes("vidro")) maiorClasse = "vidro";
    else if(classeLida.includes("aluminio")) maiorClasse = "aluminio";
    else if(classeLida.includes("pilha")) maiorClasse = "pilha";

    const dadosObjeto = dadosReciclagem[maiorClasse];
    if (dadosObjeto) {
      somMoeda.play().catch(e => {});
      document.getElementById("xpUsuario").innerText = parseInt(document.getElementById("xpUsuario").innerText) + 50;
      historicoResiduos[maiorClasse]++;
      atualizarNivel();
      resultado.innerHTML = `<div class="p-5 rounded-xl bg-slate-50 border-l-4 border-green-500 shadow-sm mt-3"><h4 class="font-bold">${dadosObjeto.nome}</h4><p class="text-sm">${dadosObjeto.dica}</p></div>`;
    }
  } catch (e) { alert("Erro de comunicação!"); }
};

  const link = document.getElementById("linkProduto").value.trim();
  if(!link) return;
  const resultado = document.getElementById("resultadoScan");
  resultado.classList.remove("hidden");
  try {
    const response = await fetch("https://ecoscan-api-asjw.onrender.com/api/analisar", {
      method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ url: link })
    });
    const data = await response.json();
    resultado.innerHTML = `<div class="p-5 rounded-xl bg-blue-50 border-l-4 border-blue-500 mt-3"><p>${data.analise}</p></div>`;
  } catch (e) { alert("Erro no servidor!"); }
};
