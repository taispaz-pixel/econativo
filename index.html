<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
<title>EcoScan - Inteligência Ambiental</title>

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#16a34a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/3246/3246310.png">

<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, collection, addDoc, deleteDoc, doc, query, orderBy, onSnapshot, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = { apiKey: "AIzaSyA0TLcy1zIAXwzgeYvmdKoqe04hPey1KXw", authDomain: "ecoscan-96a80.firebaseapp.com", projectId: "ecoscan-96a80", storageBucket: "ecoscan-96a80.appspot.com", messagingSenderId: "532877468700", appId: "1:532877468700:web:689d25217275313341abd9", measurementId: "G-ZN2B54CN07" };
const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

const EMAIL_ADMIN = "tais.paz@live.com";

// Configuração Nyckel (Para a câmara)
const NYCKEL_FUNCTION_ID = "qt82mge0uiwoay8p"; 
const NYCKEL_CLIENT_ID = "u1wgqv728lzvi1xzovisl4tvij1oak7i";
const NYCKEL_CLIENT_SECRET = "ktiutb8bsjv3yacmcbkeemop80y7ujrndgaoi26dm7z19px76fbzzs3y5tmsd0g9";

const termosProibidos = ["macaco", "viado", "negão", "puta", "homofobico", "racista", "bicha", "arrombado"];

/* BANCO DE DADOS (Sinônimos e Curiosidades) */
const dadosReciclagem = {
  "comida": { nome: "Resíduo Orgânico (Comida) 🌱", tipo: "Lixeira Marrom 🟤", dica: "Descarte na lixeira de resíduos orgânicos ou reserve para a compostagem caseira.", sinonimos: "Restos de refeições, cascas, borra de café, saquinhos de chá, cascas de ovos.", curiosidade: "Compostar o lixo orgânico pode reduzir o volume de lixo da sua casa em até 50%!" },
  "papelao": { nome: "Caixa / Papelão / Papel ♻️", tipo: "Lixeira Azul 🔵", dica: "Incrível! Esvazie todo o conteúdo e desmonte ou dobre a caixa para economizar espaço.", sinonimos: "Caixas de sapato, revistas, jornais, panfletos, papel sulfite, embalagens.", curiosidade: "Reciclar 1 tonelada de papelão salva 17 árvores adultas de serem cortadas!" },
  "plastico": { nome: "Plástico / Embalagem Pet ♻️", tipo: "Lixeira Vermelha 🔴", dica: "Lave rapidamente o interior para remover restos de líquidos ou alimentos.", sinonimos: "Garrafas PET, potes de margarina, sacolas plásticas, copos descartáveis.", curiosidade: "O plástico que você acabou de salvar demoraria até 400 anos para sumir na natureza!" },
  "vidro": { nome: "Vidro / Frascos e Potes ♻️", tipo: "Lixeira Verde 🟢", dica: "Retire tampas antes. Se estiver quebrado, embale em jornal para proteger os coletores.", sinonimos: "Garrafas de bebida, potes de geleia, copos de vidro, frascos de perfume.", curiosidade: "O vidro é 100% reciclável e pode ser reutilizado infinitas vezes sem perder qualidade." },
  "aluminio": { nome: "Alumínio / Latas de Metal ♻️", tipo: "Lixeira Amarela 🟡", dica: "Amasse bem as latinhas antes do descarte para ajudar a reduzir o volume armazenado.", sinonimos: "Latinhas de refrigerante/cerveja, latas de sardinha, tampinhas de metal.", curiosidade: "Reciclar 1 única latinha economiza energia suficiente para manter uma TV ligada por 3 horas!" }
};

const mensagensAgradecimento = [ "O planeta agradece imensamente o seu cuidado! 🌱", "Você está ajudando a reduzir o lixo no mundo! 🌍✨", "Reciclar protege nossa biodiversidade! 🌲", "O EcoScan se orgulha de você! 🎉" ];
const somMoeda = new Audio("https://assets.mixkit.co/active_storage/sfx/2013/2013-preview.mp3");

function atualizarNivel() {
  const xp = parseInt(document.getElementById("xpUsuario").innerText);
  let titulo = "Iniciante Verde 🌱"; let cor = "text-green-200";
  if (xp >= 200 && xp < 500) { titulo = "Defensor Eco 🌿"; cor = "text-emerald-300"; }
  else if (xp >= 500 && xp < 1000) { titulo = "Guardião da Natureza 🌳"; cor = "text-yellow-300"; }
  else if (xp >= 1000) { titulo = "Mestre Sustentável 🌍"; cor = "text-amber-400"; }
  const elementoTitulo = document.getElementById("tituloUsuario");
  elementoTitulo.innerText = titulo; elementoTitulo.className = text-[10px] font-black uppercase tracking-wider ${cor};
}

/* CÂMERA */
let streamAtual = null;
window.abrirCamera = async () => {
  const video = document.getElementById("cameraFeed");
  const placeholder = document.getElementById("cameraPlaceholder");
  try {
    streamAtual = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } });
    video.srcObject = streamAtual; video.classList.remove("hidden"); placeholder.classList.add("hidden");
  } catch (err) { mostrarAviso("Permita a câmera nas configurações.", "erro"); }
};

window.pararCamera = () => {
  if(streamAtual) {
    streamAtual.getTracks().forEach(t => t.stop());
    document.getElementById("cameraFeed").classList.add("hidden");
    document.getElementById("cameraPlaceholder").classList.remove("hidden");
    streamAtual = null;
  }
};

/* IA NYCKEL (Scanner de Fotos) */
async function getNyckelToken() {
  const response = await fetch('https://www.nyckel.com/connect/token', {
    method: 'POST',
    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
    body: grant_type=client_credentials&client_id=${NYCKEL_CLIENT_ID}&client_secret=${NYCKEL_CLIENT_SECRET}
  });
  const data = await response.json();
  return data.access_token;
}

window.scanearObjeto = async () => {
  const resultado = document.getElementById("resultadoScan");
  resultado.classList.remove("hidden");
  resultado.innerHTML = <div class="text-center py-6"><i class="fa-solid fa-bolt text-4xl text-green-500 mb-3 animate-bounce"></i><p class="font-semibold text-slate-700 text-xs">Analisando imagem na nuvem...</p></div>;
  const video = document.getElementById("cameraFeed");
  try {
    const canvas = document.createElement("canvas");
    canvas.width = video.videoWidth; canvas.height = video.videoHeight;
    canvas.getContext("2d").drawImage(video, 0, 0);
    const blob = await new Promise(resolve => canvas.toBlob(resolve, 'image/jpeg', 0.8));
    const token = await getNyckelToken();
    const formData = new FormData();
    formData.append('data', blob, 'image.jpg');
    const resposta = await fetch(https://www.nyckel.com/v1/functions/${NYCKEL_FUNCTION_ID}/invoke, {
      method: "POST", headers: { 'Authorization': Bearer ${token} }, body: formData
    });
    const dadosNyckel = await resposta.json();
    if (!dadosNyckel || !dadosNyckel.labelName) throw new Error("Sem resposta.");
    let classeLida = dadosNyckel.labelName.toLowerCase().trim();
    let maiorClasse = classeLida;
    if(classeLida.includes("comida") || classeLida.includes("organico") || classeLida.includes("orgânico")) maiorClasse = "comida";
    else if(classeLida.includes("papel")) maiorClasse = "papelao";
    else if(classeLida.includes("plastico") || classeLida.includes("pet")) maiorClasse = "plastico";
    else if(classeLida.includes("vidro")) maiorClasse = "vidro";
    else if(classeLida.includes("aluminio") || classeLida.includes("metal") || classeLida.includes("lata")) maiorClasse = "aluminio";

    if (maiorClasse === "fundo" || maiorClasse === "nada" || maiorClasse === "background") {
      resultado.innerHTML = <div class="p-4 rounded-xl bg-amber-50 border border-amber-200 text-amber-900 text-xs font-semibold mt-3 text-center">⚠️ Nenhum objeto detectado. Aproxime mais!</div>;
      return;
    }
    const dadosObjeto = dadosReciclagem[maiorClasse];
    if (dadosObjeto) {
      const agradecimento = mensagensAgradecimento[Math.floor(Math.random() * mensagensAgradecimento.length)];
      somMoeda.play().catch(e => {});
      document.getElementById("xpUsuario").innerText = parseInt(document.getElementById("xpUsuario").innerText) + 50;
      atualizarNivel();
      let extraCompostagem = maiorClasse === "comida" ? <div class="p-4 rounded-xl bg-amber-50 border-l-4 border-amber-500 shadow-sm mt-3 animate-fade-in"><h5 class="font-bold text-amber-900 text-sm mb-1 flex items-center gap-1"><i class="fa-solid fa-leaf"></i> Guia de Compostagem</h5><ul class="text-[11px] text-amber-900 space-y-1"><li><strong>✅ PODE:</strong> Cascas, folhas, café.</li><li><strong>❌ NÃO PODE:</strong> Carnes, óleos.</li></ul></div> : "";
      resultado.innerHTML = `
        <div class="space-y-3 mt-3 animate-fade-in">
          <div class="p-5 rounded-xl bg-slate-50 border-l-4 border-green-500 shadow-sm">
            <div class="flex items-center gap-3 mb-2"><span class="text-2xl">♻️</span><div><h4 class="font-bold text-slate-800 text-base">${dadosObjeto.nome}</h4><span class="text-xs font-bold uppercase text-green-600 tracking-wider">${dadosObjeto.tipo}</span></div></div>
            <p class="text-sm text-slate-600 leading-relaxed">${dadosObjeto.dica}</p>
            <div class="mt-3 pt-3 border-t border-slate-200"><p class="text-[11px] text-slate-500"><strong class="text-slate-600">Sinônimos:</strong> ${dadosObjeto.sinonimos}</p></div>
          </div>
          <div class="p-4 rounded-xl bg-blue-50 border border-blue-200 shadow-sm"><p class="text-[11px] font-bold text-blue-800 uppercase mb-1">💡 Curiosidade</p><p class="text-xs text-blue-900">${dadosObjeto.curiosidade}</p></div>
          ${extraCompostagem}
          <div class="p-4 rounded-xl bg-green-50 border border-green-200 text-green-800 shadow-sm text-xs font-medium flex gap-2"><span>💖</span><div><p class="font-bold">+50 XP!</p><p class="opacity-90">${agradecimento}</p></div></div>
        </div>`;
    } else {
      resultado.innerHTML = <div class="p-4 rounded-xl bg-slate-100 text-slate-700 text-xs text-center mt-3">Lido: <strong>${dadosNyckel.labelName}</strong>.</div>;
    }
  } catch (e) { mostrarAviso("Erro na comunicação com a IA da câmara.", "erro"); }
};

/* LIGAÇÃO COM O NOVO SERVIDOR RENDER (OpenAI) */
window.analisarLinkRender = async () => {
  const link = document.getElementById("linkProduto").value.trim();
  if(!link) { mostrarAviso("Cole um link primeiro!", "erro"); return; }
  
  const resultado = document.getElementById("resultadoScan");
  resultado.classList.remove("hidden");
  resultado.innerHTML = <div class="text-center py-6"><i class="fa-solid fa-robot text-4xl text-blue-500 mb-3 animate-pulse"></i><p class="font-semibold text-slate-700 text-xs">A Inteligência do Render está a ler o site...</p></div>;

  try {
    const response = await fetch("https://ecoscan-api-asjw.onrender.com/api/analisar", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ url: link })
    });
    const data = await response.json();

    if(data.sucesso) {
      somMoeda.play().catch(e => {});
      resultado.innerHTML = `
        <div class="p-5 rounded-xl bg-blue-50 border-l-4 border-blue-500 shadow-sm mt-3 animate-fade-in">
          <div class="flex items-center gap-3 mb-3">
            <span class="text-2xl">🤖</span>
            <h4 class="font-bold text-blue-900 text-base">Análise Ecológica da OpenAI</h4>
          </div>
          <p class="text-sm text-slate-700 leading-relaxed whitespace-pre-wrap">${data.analise}</p>
        </div>`;
    } else {
      resultado.innerHTML = <div class="p-4 rounded-xl bg-red-50 border border-red-200 text-red-800 text-xs text-center mt-3">Erro na IA: ${data.erro}</div>;
    }
  } catch (e) {
    resultado.innerHTML = <div class="p-4 rounded-xl bg-red-50 border border-red-200 text-red-800 text-xs text-center mt-3">Erro ao contactar o servidor Render. O seu servidor está desligado?</div>;
  }
};

/* CHAT, LOGIN E ABAS */
window.login = async () => {
  const e = document.getElementById("email").value.trim(); const s = document.getElementById("senha").value;
  if(!e||!s){ mostrarAviso("Preencha e-mail e senha","erro"); return; }
  try{ await signInWithEmailAndPassword(auth,e,s); mostrarAviso("Bem-vinda! 🎉","sucesso"); }catch(err){ mostrarAviso("Incorreto","erro"); }
};
window.registrar = async () => {
  const e = document.getElementById("email").value.trim(); const s = document.getElementById("senha").value;
  if(!e||!s||s.length<6){ mostrarAviso("Senha mínima de 6 dígitos.","erro"); return; }
  try{ await createUserWithEmailAndPassword(auth,e,s); mostrarAviso("Conta criada! 🎉","sucesso"); }catch(err){ mostrarAviso("Erro no cadastro","erro"); }
};
window.logout = async () => { await signOut(auth); };

onAuthStateChanged(auth, (u) => {
  if (u) { document.getElementById("loginBox").classList.add("hidden"); document.getElementById("appBox").classList.remove("hidden"); document.getElementById("usuario").innerText = u.email; carregarMensagens(); atualizarNivel(); }
  else { document.getElementById("loginBox").classList.remove("hidden"); document.getElementById("appBox").classList.add("hidden"); pararCamera(); }
});

window.enviarMensagem = async () => {
  const t = document.getElementById("novaMensagem").value.trim(); const u = auth.currentUser; if(!u||!t) return;
  if(termosProibidos.some(p => t.toLowerCase().includes(p))){ mostrarAviso("Termo proibido! ⚠️","erro"); return; }
  try{ await addDoc(collection(db, "mensagens"), { usuario: u.email, texto: t, data: serverTimestamp() }); document.getElementById("novaMensagem").value = ""; }catch(e){}
};
window.deletarMensagem = async (id) => { if(confirm("Deletar?")){ try{ await deleteDoc(doc(db,"mensagens",id)); }catch(e){} } };

function carregarMensagens() {
  const q = query(collection(db, "mensagens"), orderBy("data", "desc"));
  onSnapshot(q, (s) => {
    const lista = document.getElementById("listaMensagens"); if(!lista) return; lista.innerHTML = "";
    s.forEach(docSnap => {
      const m = docSnap.data(); const btn = auth.currentUser?.email === EMAIL_ADMIN ? <button onclick="deletarMensagem('${docSnap.id}')" class="text-red-500 text-[10px] px-2 py-0.5 bg-red-50 rounded border border-red-200 font-bold">X</button> : "";
      lista.innerHTML += <div class="p-3 bg-slate-50 rounded-xl mb-2 border-l-4 border-green-500 text-xs flex justify-between items-center"><div><span class="font-bold text-green-700">${m.usuario}</span><p class="text-slate-700 mt-0.5">${m.texto}</p></div>${btn}</div>;
    });
  });
}

function mostrarAviso(t, tipo) {
  const a = document.getElementById("aviso"); a.className = p-3 mb-4 rounded-xl text-sm font-medium ${tipo==='sucesso'?'bg-green-100 text-green-800':tipo==='erro'?'bg-red-100 text-red-800':'bg-blue-100 text-blue-800'};
  a.innerText = t; a.classList.remove("hidden"); setTimeout(() => a.classList.add("hidden"), 3500);
}

window.mudarAba = (nome) => {
  document.querySelectorAll(".aba-conteudo").forEach(el => el.classList.add("hidden"));
  document.querySelectorAll(".aba-btn").forEach(el => el.classList.remove("bg-green-600", "text-white"));
  document.getElementById(aba-${nome}).classList.remove("hidden");
  event.target.classList.add("bg-green-600", "text-white");
  if(nome === "escanear") abrirCamera(); else pararCamera();
};

if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js').then(() => console.log('PWA Ativo!'));
}

window.onload = atualizarNivel;
</script>

<style>
* { -webkit-tap-highlight-color: transparent; box-sizing: border-box; }
body{ margin:0; padding:0; font-family: 'Arial', sans-serif; background: linear-gradient(135deg, #f0fdf4 0%, #dcfce7 100%); min-height: 100vh; }
.card{ background:white; border-radius:28px; padding:24px; box-shadow: 0 8px 32px rgba(22, 163, 74, 0.12); }
.topo{ background:linear-gradient(135deg, #16a34a 0%, #15803d 100%); border-radius:24px; padding:20px; color:white; margin-bottom:20px; }
.scan-frame { position: relative; width: 100%; height: 320px; border-radius: 20px; overflow: hidden; background: #000; margin: 15px 0; }
.scan-line { position: absolute; width: 100%; height: 3px; background: #4ade80; animation: scan 2s linear infinite; z-index: 10; }
@keyframes scan{ 0% { top: 0%; } 50% { top: 100%; } 100% { top: 0%; } }
</style>
</head>

<body class="p-4">
<div class="w-full max-w-lg mx-auto">
  <div id="aviso" class="hidden p-3 mb-4 rounded-xl text-sm font-medium"></div>
  <div class="card">
    <div class="topo">
      <h1 class="text-2xl font-black flex items-center gap-2">🌱 EcoScan</h1>
      <p id="tituloUsuario" class="mt-1 text-[10px] font-black uppercase tracking-wider text-green-200">Iniciante Verde 🌱</p>
      <div class="mt-4 flex justify-between items-center text-xs font-bold border-t border-green-500/30 pt-3">
        <span>Progresso Eco:</span>
        <span class="bg-white/20 px-3 py-1 rounded-full">XP: <span id="xpUsuario">150</span></span>
      </div>
    </div>

    <div id="loginBox" class="space-y-4">
      <h3 class="text-lg font-bold text-slate-700 text-center mb-3">Acesse sua Conta</h3>
      <input id="email" type="email" placeholder="📧 E-mail" class="w-full p-4 bg-slate-50 border border-slate-200 rounded-xl" />
      <input id="senha" type="password" placeholder="🔒 Senha" class="w-full p-4 bg-slate-50 border border-slate-200 rounded-xl" />
      <div class="grid grid-cols-2 gap-3 pt-2">
        <button onclick="login()" class="bg-green-600 text-white p-4 rounded-xl font-bold">Entrar</button>
        <button onclick="registrar()" class="bg-slate-900 text-white p-4 rounded-xl font-bold">Criar Conta</button>
      </div>
    </div>

    <div id="appBox" class="hidden space-y-4">
      <div class="flex justify-between items-center bg-green-50 p-3 rounded-xl text-xs">
        <span class="text-slate-600 font-medium">👤 <span id="usuario"></span></span>
        <button onclick="logout()" class="text-red-600 font-bold">Sair</button>
      </div>

      <div class="grid grid-cols-3 gap-1 bg-slate-100 p-1 rounded-xl">
        <button onclick="mudarAba('escanear')" class="aba-btn py-2.5 rounded-lg text-xs font-bold bg-green-600 text-white">📷 Scanner</button>
        <button onclick="mudarAba('mapa')" class="aba-btn py-2.5 rounded-lg text-xs font-bold text-slate-600">📍 Mapa</button>
        <button onclick="mudarAba('chat')" class="aba-btn py-2.5 rounded-lg text-xs font-bold text-slate-600">💬 Mural</button>
      </div>

      <div id="aba-escanear" class="aba-conteudo space-y-3">
        <div class="scan-frame">
          <video id="cameraFeed" autoplay playsinline muted class="w-full h-full object-cover hidden"></video>
          <div id="cameraPlaceholder" class="absolute inset-0 bg-slate-950 flex flex-col items-center justify-center text-white">
            <i class="fa-solid fa-camera text-4xl opacity-20 mb-2"></i>
            <p class="text-xs opacity-40">Câmera aguardando ativação</p>
          </div>
          <div class="scan-line"></div>
        </div>
        
        <div class="grid grid-cols-2 gap-2 mb-4">
          <button onclick="abrirCamera()" class="bg-green-600 text-white py-3 rounded-xl text-sm font-bold">📷 Ligar Câmera</button>
          <button onclick="scanearObjeto()" class="bg-amber-500 text-white py-3 rounded-xl text-sm font-bold">🔍 Analisar Foto</button>
        </div>

        <div class="pt-4 border-t border-slate-200">
          <h3 class="font-bold text-sm text-slate-700 mb-2">🌐 Analisar Produto por Link (IA)</h3>
          <div class="flex gap-2">
            <input id="linkProduto" type="url" placeholder="Cole o link do produto aqui..." class="flex-1 p-3 bg-white border border-slate-200 rounded-xl text-sm shadow-sm focus:outline-none focus:border-blue-500" />
            <button onclick="analisarLinkRender()" class="bg-blue-600 text-white px-4 rounded-xl font-bold shadow-sm hover:bg-blue-700"><i class="fa-solid fa-magnifying-glass"></i></button>
          </div>
        </div>

        <div id="resultadoScan" class="hidden mt-4"></div>
      </div>

      <div id="aba-mapa" class="aba-conteudo hidden space-y-2">
        <h3 class="font-bold text-sm text-slate-700">📍 Postos de Reciclagem</h3>
        <div class="w-full h-60 bg-slate-100 rounded-xl overflow-hidden">
          <iframe class="w-full h-full border-none" src="https://maps.google.com/maps?q=postos%20de%20reciclagem&t=&z=13&ie=UTF8&iwloc=&output=embed"></iframe>
        </div>
      </div>

      <div id="aba-chat" class="aba-conteudo hidden flex flex-col h-[380px]">
        <h3 class="font-bold text-sm text-slate-700 mb-2">💬 EcoMural Coletivo</h3>
        <div id="listaMensagens" class="flex-1 overflow-y-auto bg-slate-50 rounded-xl p-3 mb-2"></div>
        <div class="flex gap-2">
          <input id="novaMensagem" type="text" placeholder="Compartilhe uma dica..." class="flex-1 p-3 bg-slate-50 border border-slate-200 rounded-xl text-sm" />
          <button onclick="enviarMensagem()" class="bg-green-600 text-white px-4 rounded-xl"><i class="fa-solid fa-paper-plane"></i></button>
        </div>
      </div>

    </div>
  </div>
</div>
</body>
</html>
