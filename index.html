<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
<title>EcoScan - Inteligência Ambiental</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@latest/dist/tf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@latest/dist/teachablemachine-image.min.js"></script>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, collection, addDoc, deleteDoc, doc, query, orderBy, onSnapshot, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = { apiKey: "AIzaSyA0TLcy1zIAXwzgeYvmdKoqe04hPey1KXw", authDomain: "ecoscan-96a80.firebaseapp.com", projectId: "ecoscan-96a80", storageBucket: "ecoscan-96a80.appspot.com", messagingSenderId: "532877468700", appId: "1:532877468700:web:689d25217275313341abd9", measurementId: "G-ZN2B54CN07" };
const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

const URL_MODELO = "https://teachablemachine.withgoogle.com/models/v7dY4t8c9/";
let model, maxPredictions;

async function carregarIA() {
  try {
    model = await tmImage.load(URL_MODELO + "model.json", URL_MODELO + "metadata.json");
    maxPredictions = model.getTotalClasses();
  } catch (e) { console.error("Erro IA:", e); }
}
carregarIA();

const dadosReciclagem = {
  "comida": { nome: "Resíduo Orgânico", tipo: "Lixeira Marrom 🟤", dica: "Perfeito para compostagem!" },
  "papelao": { nome: "Papelão / Papel", tipo: "Lixeira Azul 🔵", dica: "Dobre para economizar espaço." },
  "plastico": { nome: "Plástico / Pet", tipo: "Lixeira Vermelha 🔴", dica: "Lave para retirar restos." },
  "vidro": { nome: "Vidro", tipo: "Lixeira Verde 🟢", dica: "Cuidado ao descartar quebrados!" },
  "aluminio": { nome: "Alumínio / Metal", tipo: "Lixeira Amarela 🟡", dica: "Amasse para reciclar mais." }
};

window.scanearObjeto = async () => {
  const resultado = document.getElementById("resultadoScan");
  if (!model || !resultado) return;
  resultado.classList.remove("hidden");
  resultado.innerHTML = `<div class="text-center py-6"><i class="fa-solid fa-circle-notch animate-spin text-green-600"></i></div>`;
  
  try {
    const prediction = await model.predict(document.getElementById("cameraFeed"));
    let mC = "", mP = 0;
    for(let i=0; i<maxPredictions; i++) { if(prediction[i].probability > mP) { mP = prediction[i].probability; mC = prediction[i].className.toLowerCase().trim(); } }
    
    if (mC === "fundo" || mP < 0.5) {
      resultado.innerHTML = `<div class="p-4 bg-amber-50 text-amber-900 text-center font-bold text-xs mt-3">Nenhum objeto detectado!</div>`;
      return;
    }

    let extra = mC === "comida" ? `<div class="p-3 bg-amber-50 border-l-4 border-amber-400 text-xs mt-2">🍂 <b>Dica de Compostagem:</b> Cascas, restos de legumes, borra de café e ovos são ótimos! Evite carnes e laticínios.</div>` : "";
    
    resultado.innerHTML = `
      <div class="p-4 bg-slate-50 rounded-xl border-l-4 border-green-500 shadow-sm mt-3">
        <h4 class="font-bold text-slate-800">${dadosReciclagem[mC]?.nome || mC}</h4>
        <p class="text-green-600 font-bold text-xs">${dadosReciclagem[mC]?.tipo || ""}</p>
        <p class="text-xs text-slate-600 mt-2">${dadosReciclagem[mC]?.dica || ""}</p>
      </div>
      ${extra}
    `;
  } catch (e) { console.error(e); }
};

window.login = async () => { try { await signInWithEmailAndPassword(auth, document.getElementById("email").value, document.getElementById("senha").value); } catch(e) { alert("Erro ao entrar"); } };
window.logout = async () => await signOut(auth);
onAuthStateChanged(auth, (u) => {
    if(u) { document.getElementById("loginBox").classList.add("hidden"); document.getElementById("appBox").classList.remove("hidden"); }
    else { document.getElementById("loginBox").classList.remove("hidden"); document.getElementById("appBox").classList.add("hidden"); }
});
</script>
</head>
<body class="bg-green-50 p-4">
  <div class="max-w-lg mx-auto bg-white rounded-3xl p-6 shadow-xl">
    <div id="loginBox">
        <input id="email" type="email" placeholder="E-mail" class="w-full p-3 border rounded-xl mb-2">
        <input id="senha" type="password" placeholder="Senha" class="w-full p-3 border rounded-xl mb-4">
        <button onclick="login()" class="w-full bg-green-600 text-white p-3 rounded-xl font-bold">Entrar</button>
    </div>
    <div id="appBox" class="hidden">
        <button onclick="logout()" class="text-red-500 text-xs font-bold mb-4">Sair</button>
        <div class="scan-frame w-full h-64 bg-black rounded-2xl overflow-hidden mb-4">
            <video id="cameraFeed" autoplay playsinline class="w-full h-full object-cover"></video>
        </div>
        <button onclick="scanearObjeto()" class="w-full bg-green-600 text-white font-bold py-4 rounded-xl">Analisar</button>
        <div id="resultadoScan" class="hidden"></div>
    </div>
  </div>
</body>
</html>
