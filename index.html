<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>

<title>EcoScan - Inteligência Ambiental</title>

<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />

<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs"></script>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/mobilenet"></script>

<script type="module">
/* =========================
   FIREBASE IMPORTS
========================= */
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {
  getAuth,
  signInWithEmailAndPassword,
  createUserWithEmailAndPassword,
  signOut,
  onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {
  getFirestore,
  collection,
  addDoc,
  deleteDoc,
  doc,
  query,
  orderBy,
  onSnapshot,
  serverTimestamp
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

/* =========================
   FIREBASE CONFIG
========================= */
const firebaseConfig = {
  apiKey: "AIzaSyA0TLcy1zIAXwzgeYvmdKoqe04hPey1KXw",
  authDomain: "ecoscan-96a80.firebaseapp.com",
  projectId: "ecoscan-96a80",
  storageBucket: "ecoscan-96a80.appspot.com",
  messagingSenderId: "532877468700",
  appId: "1:532877468700:web:689d25217275313341abd9",
  measurementId: "G-ZN2B54CN07"
};

/* =========================
   INICIAR SISTEMAS
========================= */
const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

let modeloIA = null;
const EMAIL_ADMIN = "tais.paz@live.com";

// Carregar o modelo de IA assim que a página abrir
async function carregarModeloIA() {
  try {
    modeloIA = await mobilenet.load();
    console.log("Modelo de IA carregado com sucesso!");
  } catch (error) {
    console.error("Erro ao carregar modelo de IA:", error);
  }
}
carregarModeloIA();

// Lista básica de termos proibidos para moderação automática
const termosProibidos = [
  "macaco", "macaca", "viado", "viadinho", "tição", "crioulo", "negão", "sapatão", "traveco",
  "bicha", "puta", "caralho", "porra", "arrombado", "fudge", "racista", "homofobico"
];

/* =========================
   LOGIN & CADASTRO
========================= */
window.login = async () => {
  const email = document.getElementById("email").value.trim();
  const senha = document.getElementById("senha").value;

  if (!email || !senha) {
    mostrarAviso("Preencha email e senha!", "erro");
    return;
  }

  try {
    await signInWithEmailAndPassword(auth, email, senha);
    mostrarAviso("Login realizado com sucesso! 🎉", "sucesso");
  } catch (error) {
    let mensagem = "Erro no login: ";
    switch(error.code) {
      case 'auth/user-not-found': mensagem = "Usuário não cadastrado"; break;
      case 'auth/wrong-password': mensagem = "Senha incorreta"; break;
      case 'auth/invalid-email': mensagem = "E-mail inválido"; break;
      default: mensagem += error.message;
    }
    mostrarAviso(mensagem, "erro");
  }
};

window.registrar = async () => {
  const email = document.getElementById("email").value.trim();
  const senha = document.getElementById("senha").value;

  if (!email || !senha) {
    mostrarAviso("Preencha email e senha!", "erro");
    return;
  }

  if(senha.length < 6) {
    mostrarAviso("Senha deve ter pelo menos 6 caracteres", "erro");
    return;
  }

  try {
    await createUserWithEmailAndPassword(auth, email, senha);
    mostrarAviso("Conta criada com sucesso! 🎉", "sucesso");
  } catch (error) {
    let mensagem = "Erro no cadastro: ";
    switch(error.code) {
      case 'auth/email-already-in-use': mensagem = "E-mail já cadastrado"; break;
      case 'auth/invalid-email': mensagem = "E-mail inválido"; break;
      default: mensagem += error.message;
    }
    mostrarAviso(mensagem, "erro");
  }
};

window.logout = async () => {
  await signOut(auth);
  mostrarAviso("Você saiu da conta", "info");
};

onAuthStateChanged(auth, (user) => {
  if (user) {
    document.getElementById("loginBox").classList.add("hidden");
    document.getElementById("appBox").classList.remove("hidden");
    document.getElementById("usuario").innerText = user.email;
    carregarMensagens();
  } else {
    document.getElementById("loginBox").classList.remove("hidden");
    document.getElementById("appBox").classList.add("hidden");
    pararCamera();
  }
});

/* =========================
   CÂMERA E INTELIGÊNCIA ARTIFICIAL
========================= */
let streamAtual = null;

window.abrirCamera = async () => {
  const video = document.getElementById("cameraFeed");
  const placeholder = document.getElementById("cameraPlaceholder");
  
  try {
    streamAtual = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: "environment", width: {ideal:1280}, height: {ideal:720} }
    });
    video.srcObject = streamAtual;
    video.classList.remove("hidden");
    placeholder.classList.add("hidden");
    mostrarAviso("Câmera ativada ✅", "info");
  } catch (err) {
    mostrarAviso("Permita o acesso à câmera nas configurações ⚠️", "erro");
  }
};

window.pararCamera = () => {
  if(streamAtual) {
    streamAtual.getTracks().forEach(track => track.stop());
    document.getElementById("cameraFeed").classList.add("hidden");
    document.getElementById("cameraPlaceholder").classList.remove("hidden");
    streamAtual = null;
  }
};

// Dicionário inteligente para mapear o que a IA vê para as regras de descarte do Brasil
const mapeamentoReciclagem = {
  "bottle": { nome: "Garrafa Plástica / Vidro", tipo: "Plástico ou Vidro ♻️", dica: "Lave bem antes de descartar. Se for plástico vai na lixeira vermelha, se for vidro vai na verde." },
  "box": { nome: "Embalagem de Papelão / Caixa", tipo: "Papel e Papelão ♻️", dica: "Desmonte a caixa, retire fitas plásticas e descarte na lixeira azul (Papel)." },
  "carton": { nome: "Caixa de Papelão / Sucrilhos / Leite", tipo: "Papel e Papelão ♻️", dica: "Excelente! Remova resíduos internos, dobre para economizar espaço e jogue na lixeira azul." },
  "can": { nome: "Lata de Alumínio / Metal", tipo: "Metal ♻️", dica: "Amasse para economizar espaço no transporte. Descarte na lixeira amarela." },
  "cup": { nome: "Copo / Recipiente", tipo: "Resíduo Descartável ♻️", dica: "Se for plástico limpo, lixeira vermelha. Se estiver muito sujo de comida, jogue no lixo orgânico." },
  "packet": { nome: "Embalagem Plástica / Pacote", tipo: "Plástico ♻️", dica: "Retire todo o conteúdo de dentro. Descarte na lixeira vermelha." },
  "food": { nome: "Resíduo de Alimento / Fruta", tipo: "Orgânico 🌱", dica: "Perfeito para compostagem caseira! Caso contrário, descarte na lixeira marrom." }
};

const mensagensAgradecimento = [
  "O planeta agradece imensamente o seu cuidado! Cada pequeno descarte correto constrói um futuro mais limpo. 🌱",
  "Parabéns pela atitude sustentável! Você está ajudando a reduzir o lixo acumulado no mundo. 🌍✨",
  "Excelente trabalho! Reciclar protege a nossa biodiversidade e economiza recursos naturais valiosos. 🌲",
  "Atitude exemplar! O EcoScan se orgulha de ter você na nossa comunidade verde. 🎉"
];

window.scanearObjeto = async () => {
  const resultado = document.getElementById("resultadoScan");
  resultado.classList.remove("hidden");
  resultado.innerHTML = `
    <div class="text-center py-6">
      <i class="fa-solid fa-circle-notch text-4xl text-green-600 mb-3 animate-spin"></i>
      <p class="font-semibold text-slate-700 text-sm">IA processando imagem em tempo real...</p>
    </div>
  `;

  if (!modeloIA) {
    setTimeout(() => { mostrarAviso("Aguarde a IA inicializar mais alguns segundos...", "info"); }, 500);
  }

  const video = document.getElementById("cameraFeed");
  
  try {
    let objetoIdentificado = null;
    let dadosReciclagem = { nome: "Objeto Não Identificado", tipo: "Análise Genérica", dica: "Tente aproximar mais o objeto da câmera sob boa iluminação. Na dúvida, separe os materiais secos dos úmidos." };

    // Se a câmera real estiver ativa, roda a IA sobre o frame do vídeo
    if (streamAtual && modeloIA) {
      const predicoes = await modeloIA.classify(video);
      if (predicoes && predicoes.length > 0) {
        // Pega o termo em inglês que a IA detectou
        const classeDetectada = predicoes[0].className.toLowerCase();
        
        // Procura no nosso dicionário se bate com alguma regra nossa
        for (const chave in mapeamentoReciclagem) {
          if (classeDetectada.includes(chave)) {
            objetoIdentificado = chave;
            dadosReciclagem = mapeamentoReciclagem[chave];
            break;
          }
        }
        
        // Se a IA achar algo que não mapeamos, monta uma resposta dinâmica inteligente
        if (!objetoIdentificado) {
          dadosReciclagem.nome = predicoes[0].className.split(',')[0];
          dadosReciclagem.tipo = "Análise por IA";
          dadosReciclagem.dica = "Certifique-se de limpar a embalagem. Separe plásticos, papéis e metais nas suas respectivas lixeiras coloridas.";
        }
      }
    } else {
      // Fallback simulador caso a câmera esteja desligada na hora do clique
      const chaves = Object.keys(mapeamentoReciclagem);
      dadosReciclagem = mapeamentoReciclagem[chaves[Math.floor(Math.random() * chaves.length)]];
    }

    // Escolhe uma mensagem linda de agradecimento aleatória
    const agradecimento = mensagensAgradecimento[Math.floor(Math.random() * mensagensAgradecimento.length)];

    resultado.innerHTML = `
      <div class="space-y-3 mt-3 animate-fade-in">
        <div class="p-5 rounded-xl bg-slate-50 border-l-4 border-green-500 shadow-sm">
          <div class="flex items-center gap-3 mb-2">
            <span class="text-2xl">♻️</span>
            <div>
              <h4 class="font-bold text-base text-slate-800 capitalize">${dadosReciclagem.nome}</h4>
              <span class="text-xs font-bold uppercase text-green-600 tracking-wider">${dadosReciclagem.tipo}</span>
            </div>
          </div>
          <p class="text-sm text-slate-600 leading-relaxed">${dadosReciclagem.dica}</p>
        </div>

        <div class="p-4 rounded-xl bg-green-50 border border-green-200 text-green-800 shadow-sm text-xs font-medium leading-relaxed flex gap-2 items-start">
          <span class="text-lg">💖</span>
          <div>
            <p class="font-bold mb-0.5">Obrigado por reciclar!</p>
            <p class="opacity-90">${agradecimento}</p>
          </div>
        </div>
      </div>
    `;

    const xpAtual = parseInt(document.getElementById("xpUsuario").innerText);
    document.getElementById("xpUsuario").innerText = xpAtual + 50;
    mostrarAviso("+50 Pontos Eco! 🌱", "sucesso");

  } catch (err) {
    console.error(err);
    mostrarAviso("Erro ao analisar imagem.", "erro");
  }
};

/* =========================
   MURAL COMUNIDADE & MODERAÇÃO
========================= */
window.enviarMensagem = async () => {
  const texto = document.getElementById("novaMensagem").value.trim();
  const user = auth.currentUser;

  if(!user) { mostrarAviso("Faça login primeiro", "erro"); return; }
  if(!texto) { mostrarAviso("Digite uma mensagem", "erro"); return; }

  // Filtro preventivo automático anti-preconceito e toxicidade
  const textoMinusculo = texto.toLowerCase();
  const contemOfensa = termosProibidos.some(termo => textoMinusculo.includes(termo));

  if (contemOfensa) {
    mostrarAviso("Mensagem bloqueada! Viola as diretrizes de respeito da comunidade. ⚠️", "erro");
    document.getElementById("novaMensagem").value = "";
    return;
  }

  try {
    await addDoc(collection(db, "mensagens"), {
      usuario: user.email,
      texto: texto,
      data: serverTimestamp()
    });
    document.getElementById("novaMensagem").value = "";
  } catch(e) {
    mostrarAviso("Erro ao enviar mensagem", "erro");
  }
};

window.deletarMensagem = async (idDocumento) => {
  if (confirm("Deseja realmente apagar esta mensagem da comunidade?")) {
    try {
      await deleteDoc(doc(db, "mensagens", idDocumento));
      mostrarAviso("Mensagem excluída com sucesso.", "info");
    } catch (error) {
      mostrarAviso("Erro ao deletar mensagem.", "erro");
    }
  }
};

function carregarMensagens() {
  const q = query(collection(db, "mensagens"), orderBy("data", "desc"));
  onSnapshot(q, (snapshot) => {
    const lista = document.getElementById("listaMensagens");
    if(!lista) return;
    lista.innerHTML = "";
    
    const usuarioLogado = auth.currentUser ? auth.currentUser.email : "";

    snapshot.forEach(docSnap => {
      const msg = docSnap.data();
      const idMsg = docSnap.id;
      const data = msg.data?.toDate() || new Date();
      
      // Se for você logada (Admin), mostra o botão de apagar
      const botaoExcluir = (usuarioLogado === EMAIL_ADMIN) 
        ? `<button onclick="deletarMensagem('${idMsg}')" class="text-red-500 hover:text-red-700 text-[11px] font-bold px-1.5 py-0.5 bg-red-50 rounded border border-red-100"><i class="fa-solid fa-trash"></i> Apagar</button>` 
        : "";
      
      lista.innerHTML += `
        <div class="p-3 bg-slate-50 rounded-xl mb-2 border-l-4 border-green-500 shadow-sm flex flex-col justify-between">
          <div class="flex justify-between items-center mb-1 w-full">
            <span class="font-bold text-xs text-green-700">${msg.usuario}</span>
            <div class="flex items-center gap-2">
              <span class="text-[10px] text-slate-400">${data.toLocaleTimeString()}</span>
              ${botaoExcluir}
            </div>
          </div>
          <p class="text-sm text-slate-700 mt-1">${msg.texto}</p>
        </div>
      `;
    });
  });
}

/* =========================
   UTILITÁRIOS
========================= */
function mostrarAviso(texto, tipo) {
  const aviso = document.getElementById("aviso");
  aviso.classList.remove("hidden", "bg-green-100", "bg-red-100", "bg-blue-100", "text-green-800", "text-red-800", "text-blue-800");
  
  let cor = "bg-blue-100 text-blue-800";
  if(tipo === "sucesso") cor = "bg-green-100 text-green-800";
  if(tipo === "erro") cor = "bg-red-100 text-red-800";

  aviso.className = `p-3 mb-4 rounded-xl text-sm font-medium ${cor}`;
  aviso.innerText = texto;
  aviso.classList.remove("hidden");

  setTimeout(() => aviso.classList.add("hidden"), 4000);
}

window.mudarAba = (nome) => {
  document.querySelectorAll(".aba-conteudo").forEach(el => el.classList.add("hidden"));
  document.querySelectorAll(".aba-btn").forEach(el => el.classList.remove("bg-green-600", "text-white"));

  document.getElementById(`aba-${nome}`).classList.remove("hidden");
  event.target.classList.add("bg-green-600", "text-white");

  if(nome === "escanear") abrirCamera();
  else pararCamera();
};
</script>

<style>
* { -webkit-tap-highlight-color: transparent; box-sizing: border-box; }
body{
  margin:0; padding:0; font-family: 'Arial', sans-serif;
  background: linear-gradient(135deg, #f0fdf4 0%, #dcfce7 100%); min-height: 100vh;
}
.card{
  background:white; border-radius:28px; padding:24px;
  box-shadow: 0 8px 32px rgba(22, 163, 74, 0.12); border: 1px solid rgba(22, 163, 74, 0.08);
}
.topo{
  background:linear-gradient(135deg, #16a34a 0%, #15803d 100%);
  border-radius:24px; padding:24px; color:white; margin-bottom:20px;
  box-shadow: 0 4px 12px rgba(21, 128, 61, 0.2);
}
.scan-frame {
  position: relative; width: 100%; height: 320px;
  border-radius: 20px; overflow: hidden; background: #000; margin: 15px 0;
}
.scan-line {
  position: absolute; width: 100%; height: 3px; background: #4ade80;
  box-shadow: 0 0 8px #4ade80; animation: scan 2s linear infinite; z-index: 10;
}
@keyframes scan{ 0% { top: 0%; } 50% { top: 100%; } 100% { top: 0%; } }
</style>
</head>

<body class="p-4">
<div class="w-full max-w-lg mx-auto">
  <div id="aviso" class="hidden p-3 mb-4 rounded-xl text-sm font-medium"></div>

  <div class="card">
    <div class="topo">
      <h1 class="text-2xl font-black flex items-center gap-2">🌱 EcoScan</h1>
      <p class="mt-1 opacity-90 text-xs">Inteligência Ambiental para um futuro sustentável</p>
      <div class="mt-3 flex justify-between items-center text-xs font-bold">
        <span>Progresso Eco:</span>
        <span class="bg-white/20 px-3 py-1 rounded-full">XP: <span id="xpUsuario">350</span></span>
      </div>
    </div>

    <div id="loginBox" class="space-y-4">
      <h3 class="text-lg font-bold text-slate-700 text-center mb-3">Acesse sua Conta</h3>
      <input id="email" type="email" placeholder="📧 Digite seu e-mail" class="w-full p-4 bg-slate-50 border border-slate-200 rounded-xl text-base focus:outline-none focus:ring-2 focus:ring-green-500" />
      <input id="senha" type="password" placeholder="🔒 Digite sua senha" class="w-full p-4 bg-slate-50 border border-slate-200 rounded-xl text-base focus:outline-none focus:ring-2 focus:ring-green-500" />
      
      <div class="grid grid-cols-2 gap-3 pt-2">
        <button onclick="login()" class="bg-green-600 text-white p-4 rounded-xl font-bold text-base shadow-md active:scale-95 hover:bg-green-700">Entrar</button>
        <button onclick="registrar()" class="bg-slate-900 text-white p-4 rounded-xl font-bold text-base shadow-md active:scale-95 hover:bg-slate-800">Criar Conta</button>
      </div>
    </div>

    <div id="appBox" class="hidden space-y-4">
      <div class="flex justify-between items-center bg-green-50 p-3 rounded-xl text-xs border border-green-100">
        <span class="text-slate-600 font-medium">👤 <span id="usuario"></span></span>
        <button onclick="logout()" class="text-red-600 font-bold hover:underline">Sair</button>
      </div>

      <div class="grid grid-cols-3 gap-1 bg-slate-100 p-1 rounded-xl">
        <button onclick="mudarAba('escanear')" class="aba-btn py-2.5 rounded-lg text-xs font-bold text-slate-600 bg-green-600 text-white">📷 Scanner</button>
        <button onclick="mudarAba('mapa')" class="aba-btn py-2.5 rounded-lg text-xs font-bold text-slate-600">📍 Mapa</button>
        <button onclick="mudarAba('chat')" class="aba-btn py-2.5 rounded-lg text-xs font-bold text-slate-600">💬 Mural</button>
      </div>

      <div id="aba-escanear" class="aba-conteudo space-y-3">
        <div class="scan-frame">
          <video id="cameraFeed" autoplay playsinline muted class="w-full h-full object-cover hidden"></video>
          <div id="cameraPlaceholder" class="absolute inset-0 bg-gradient-to-b from-slate-900 to-black flex flex-col items-center justify-center text-white">
            <i class="fa-solid fa-camera text-4xl opacity-20 mb-2"></i>
            <p class="text-xs opacity-40">Câmera aguardando ativação</p>
          </div>
          <div class="scan-line"></div>
        </div>
        <div class="grid grid-cols-2 gap-2">
          <button onclick="abrirCamera()" class="bg-green-600 text-white py-3 rounded-xl text-sm font-bold active:scale-95">📷 Ligar Câmera</button>
          <button onclick="scanearObjeto()" class="bg-amber-500 text-white py-3 rounded-xl text-sm font-bold active:scale-95">🔍 Analisar</button>
        </div>
        <div id="resultadoScan" class="hidden"></div>
      </div>

      <div id="aba-mapa" class="aba-conteudo hidden space-y-2">
        <h3 class="font-bold text-sm text-slate-700">📍 Postos de Reciclagem Próximos</h3>
        <div class="w-full h-60 bg-slate-100 rounded-xl overflow-hidden border border-slate-200">
          <iframe class="w-full h-full border-none" src="https://maps.google.com/maps?q=reciclagem&t=&z=13&ie=UTF-8&iwloc=&output=embed" allowfullscreen loading="lazy"></iframe>
        </div>
      </div>

      <div id="aba-chat" class="aba-conteudo hidden flex flex-col h-[380px]">
        <h3 class="font-bold text-sm text-slate-700 mb-2">💬 EcoMural em Tempo Real</h3>
        <div id="listaMensagens" class="flex-1 overflow-y-auto bg-slate-50 border border-slate-100 rounded-xl p-3 mb-2"></div>
        <div class="flex gap-2">
          <input id="novaMensagem" type="text" placeholder="Compartilhe uma dica sustentável..." class="flex-1 p-3 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-green-500" />
          <button onclick="enviarMensagem()" class="bg-green-600 text-white px-4 rounded-xl font-bold active:scale-95"><i class="fa-solid fa-paper-plane"></i></button>
        </div>
      </div>

    </div>
  </div>
</div>
</body>
</html>
