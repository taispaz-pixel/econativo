function atualizarNivel() {
  const elXP = document.getElementById("xpUsuario");
  const elTitulo = document.getElementById("tituloUsuario");
  if(!elXP ||!elTitulo) return;

  const xp = parseInt(elXP.innerText || 0);
  let titulo = "Iniciante Verde 🌱"; let cor = "text-green-200";
  if (xp >= 200 && xp < 500) { titulo = "Defensor Eco 🌿"; cor = "text-emerald-300"; }
  else if (xp >= 500 && xp < 1000) { titulo = "Guardião da Natureza 🌳"; cor = "text-yellow-300"; }
  else if (xp >= 1000) { titulo = "Mestre Sustentável 🌍"; cor = "text-amber-400"; }

  elTitulo.innerText = titulo;
  elTitulo.className = `mt-1 text- font-black uppercase tracking-wider ${cor}`;
  atualizarRelatorioGrafico();
}

function atualizarRelatorioGrafico() {
  const elTotalItens = document.getElementById("relTotalItens");
  const elTotalKg = document.getElementById("relTotalKg");
  const elTotalPontos = document.getElementById("relTotalPontos");
  const elTotalImpacto = document.getElementById("relTotalImpacto");
  const elLista = document.getElementById("relatorioLista");
  if(!elTotalItens ||!elTotalKg ||!elTotalPontos ||!elTotalImpacto ||!elLista) return;

  let totalItens = 0; let totalKg = 0; let totalPontos = 0; let totalImpacto = 0;
  let htmlDetalhes = "";

  for (const [chave, qtd] of Object.entries(historicoResiduos)) {
    if (qtd > 0) {
      totalItens += qtd;
      let pesoTotalClass = qtd * dadosReciclagem[chave].pesoKg;
      let pontosTotalClass = qtd * dadosReciclagem[chave].pontos;
      let impactoClass = qtd * dadosReciclagem[chave].pesoImpacto;

      totalKg += pesoTotalClass;
      totalPontos += pontosTotalClass;
      totalImpacto += impactoClass;

      htmlDetalhes += `
        <div class="flex justify-between items-center bg-white p-3 rounded-xl border border-slate-200 mb-2 shadow-sm">
          <div><p class="font-bold text-sm text-slate-800">${dadosReciclagem[chave].nome}</p><p class="text-xs text-slate-500">${qtd} itens</p></div>
          <div class="text-right"><p class="font-bold text-green-700">+ ${pontosTotalClass} pts</p><p class="text- font-medium text-blue-500">↓ ${impactoClass.toFixed(2)}% imp.</p></div>
        </div>`;
    }
  }

  if (totalItens === 0) { htmlDetalhes = `<p class="text-xs text-center text-slate-500 italic mt-4">Ainda sem dados cadastrados.</p>`; }

  if(elTotalItens) elTotalItens.innerText = totalItens;
  if(elTotalKg) elTotalKg.innerText = totalKg.toFixed(2) + " kg";
  if(elTotalPontos) elTotalPontos.innerText = totalPontos + " pts";
  if(elTotalImpacto) elTotalImpacto.innerText = "↓ " + totalImpacto.toFixed(2) + "%";
  if(elLista) elLista.innerHTML = htmlDetalhes;
}

async function buscarAvaliacoes(dias = 0) {
  const u = auth.currentUser;
  if(!u) return [];
  const dataLimite = new Date();
  dataLimite.setDate(dataLimite.getDate() - dias);
  const q = query(collection(db, "avaliacoes_app"), where("usuario", "==", u.email), where("data", ">=", dataLimite));
  const querySnapshot = await getDocs(q);
  const avaliacoes = [];
  querySnapshot.forEach((doc) => { avaliacoes.push({id: doc.id,...doc.data()}); });
  return avaliacoes;
}

function gerarPDFAvaliacoes(avaliacoes, titulo) {
  const { jsPDF } = window.jspdf; const doc = new jsPDF();
  const usuarioEmail = auth.currentUser? auth.currentUser.email : "Visitante";
  const dataHoje = new Date().toLocaleDateString('pt-BR');
  doc.setFillColor(126, 34, 206); doc.rect(0, 0, 220, 40, 'F');
  doc.setTextColor(255, 255, 255); doc.setFont("Helvetica", "bold"); doc.setFontSize(24);
  doc.text("EcoNativo", 15, 20); doc.setFontSize(10); doc.setFont("Helvetica", "normal");
  doc.text(titulo.toUpperCase(), 15, 30);
  doc.setTextColor(51, 65, 85); doc.setFontSize(11);
  doc.text(`Usuário: ${usuarioEmail}`, 15, 52); doc.text(`Emitido em: ${dataHoje}`, 15, 58);
  const linhas = [];
  if(avaliacoes.length === 0) { linhas.push(["-", "-", "-", "-"]); } else {
    avaliacoes.forEach(av => {
      const data = av.data?.toDate? av.data.toDate().toLocaleDateString('pt-BR') : "Sem data";
      linhas.push([data, av.nota || "", av.categoria || "", av.subcategoria || ""]);
    });
  }
  doc.autoTable({ startY: 65, head: [['Data', 'Nota', 'Categoria', 'Detalhe']], body: linhas, headStyles: { fillColor: [126, 34, 206] }, theme: 'grid', styles: { fontSize: 9 } });

  doc.text("Obrigado por nos ajudar a melhorar! 💜", 105, doc.internal.pageSize.height - 15, { align: "center" });
  window.open(doc.output('bloburl'), '_blank');
}

function carregarMensagens() {
  const qry = query(collection(db, "mensagens_mural"), orderBy("data", "desc"));
  onSnapshot(qry, (snap) => {
    const lista = document.getElementById("listaMensagens");
    if(!lista) return;
    lista.innerHTML = "";
    snap.forEach((doc) => {
      const msg = doc.data();
      const data = msg.data?.toDate? msg.data.toDate().toLocaleTimeString('pt-BR') : "";
      lista.innerHTML += `
        <div class="p-3 bg-slate-50 rounded-xl mb-2 border-l-4 border-green-500">
          <p class="text-xs font-bold text-green-700">${msg.usuario} <span class="text-slate-400 font-normal">${data}</span></p>
          <p class="text-sm text-slate-700 mt-1">${msg.texto}</p>
        </div>`;
    });
  });
}

  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '&copy; OpenStreetMap contributors'
  }).addTo(mapa);

  if (navigator.geolocation) {
    navigator.geolocation.getCurrentPosition(
      (pos) => {
        usuarioLat = pos.coords.latitude; usuarioLng = pos.coords.longitude;
        mapa.setView([usuarioLat, usuarioLng], 14);
        L.marker([usuarioLat, usuarioLng], {icon: L.icon({ iconUrl: 'https://cdn-icons-png.flaticon.com/512/684/684908.png', iconSize: [32,32] })}).addTo(mapa).bindPopup("Você está aqui! 📍").openPopup();
        const pontos = [
          {lat: usuarioLat + 0.012, lng: usuarioLng - 0.008, nome: "Ponto Coleta", tipo: "Plástico / Vidro"},
          {lat: usuarioLat - 0.009, lng: usuarioLng + 0.015, nome: "Ecoponto", tipo: "Pilhas"}
        ];
        pontos.forEach(pt => {
          L.marker([pt.lat, pt.lng], {icon: L.icon({ iconUrl: 'https://cdn-icons-png.flaticon.com/512/149/149062.png', iconSize: [28,28] })}).addTo(mapa).bindPopup(`<b>${pt.nome}</b><br>${pt.tipo}`);
        });
      }, (erro) => { alert("Sem localização: " + erro.message); }
    );
  }
}

let streamAtual = null;
window.abrirCamera = async () => {
  const video = document.getElementById("cameraFeed");
  const placeholder = document.getElementById("cameraPlaceholder");
  if(!video ||!placeholder) return;
  try {
    streamAtual = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } });
    video.srcObject = streamAtual;
    video.classList.remove("hidden");
    placeholder.classList.add("hidden");
  } catch (err) {
    alert("Para analisar resíduos, você precisa permitir o uso da câmera.");
  }
};

window.pararCamera = () => {
  if(streamAtual) {
    streamAtual.getTracks().forEach(t => t.stop());
    const video = document.getElementById("cameraFeed");
    const placeholder = document.getElementById("cameraPlaceholder");
    if(video) { video.srcObject = null; video.classList.add("hidden"); }
    if(placeholder) placeholder.classList.remove("hidden");
    streamAtual = null;
  }
};

// ==========================================
// 🚀 IA: CACHE E PROTEÇÃO CONTRA TELA PRETA
// ==========================================
async function getNyckelToken() {
  if (tokenNyckelSalvo && (Date.now() - tempoToken < 3000000)) return tokenNyckelSalvo;
  try {
    const response = await fetch('https://www.nyckel.com/connect/token', {
      method: 'POST', headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
      body: `grant_type=client_credentials&client_id=${NYCKEL_CLIENT_ID}&client_secret=${NYCKEL_CLIENT_SECRET}`
    });
    if (!response.ok) throw new Error("Falha na autenticação da IA.");
    const data = await response.json();
    tokenNyckelSalvo = data.access_token; tempoToken = Date.now();
    return tokenNyckelSalvo;
  } catch (erro) { throw new Error(erro.message); }
}

window.scanearObjeto = async () => {
  const resultado = document.getElementById("resultadoScan");
  const video = document.getElementById("cameraFeed");
  if(!resultado ||!video) return;

  if (!video.srcObject || video.videoWidth === 0 || video.classList.contains("hidden")) {
    alert("⚠️ Opa! Você precisa ligar a câmera primeiro e apontar para um objeto.");
    return;
  }

  resultado.classList.remove("hidden");
  resultado.innerHTML = `<div class="text-center py-6"><i class="fa-solid fa-bolt text-4xl text-green-500 mb-3 animate-bounce"></i><p class="font-semibold text-slate-700 text-xs">Analisando inteligência na nuvem...</p></div>`;

  try {
    const canvas = document.createElement("canvas");
    canvas.width = video.videoWidth; canvas.height = video.videoHeight;
    canvas.getContext("2d").drawImage(video, 0, 0);
    const blob = await new Promise(resolve => canvas.toBlob(resolve, 'image/jpeg', 0.8));
    if(!blob) throw new Error("Falha ao capturar o frame da câmera.");

    const token = await getNyckelToken();
    const formData = new FormData(); formData.append('data', blob, 'image.jpg');

    const resposta = await fetch(`https://www.nyckel.com/v1/functions/${NYCKEL_FUNCTION_ID}/invoke`, {
      method: "POST", headers: { 'Authorization': `Bearer ${token}` }, body: formData
    });

    if(!resposta.ok) {
        let msg = await resposta.text();
        throw new Error(`Servidor rejeitou a requisição. Limite atingido? Detalhe: ${msg}`);
    }

    const dadosNyckel = await resposta.json();
    if (!dadosNyckel ||!dadosNyckel.labelName) throw new Error("O objeto não foi reconhecido.");

    let classeLida = dadosNyckel.labelName.toLowerCase().trim();
    let maiorClasse = classeLida;

    if(classeLida.includes("comida") || classeLida.includes("organico")) maiorClasse = "comida";
    else if(classeLida.includes("papel")) maiorClasse = "papelao";
    else if(classeLida.includes("plastico") || classeLida.includes("pet")) maiorClasse = "plastico";
    else if(classeLida.includes("vidro")) maiorClasse = "vidro";
    else if(classeLida.includes("aluminio") || classeLida.includes("metal") || classeLida.includes("lata")) maiorClasse = "aluminio";
    else if(classeLida.includes("pilha") || classeLida.includes("bateria")) maiorClasse = "pilha";

    if (maiorClasse === "fundo" || maiorClasse === "nada") {
      resultado.innerHTML = `<div class="p-4 rounded-xl bg-amber-50 text-amber-900 text-xs font-semibold text-center mt-3">⚠️ Nenhum objeto claro detectado. Centralize o resíduo e tente novamente.</div>`; return;
    }

    const dadosObjeto = dadosReciclagem[maiorClasse];
    if (dadosObjeto) {
      somMoeda.play().catch(e => {});
      const elXP = document.getElementById("xpUsuario");
      if(elXP
         if(elXP) elXP.innerText = parseInt(elXP.innerText) + 50;
      historicoResiduos[maiorClasse]++;
      atualizarNivel();

      let isPilha = (maiorClasse === "pilha");
      let termoBusca = isPilha ? "pontos de coleta de pilhas e baterias" : "postos de reciclagem";
      
      // CORREÇÃO: Usando ${...} para a URL funcionar
      let urlMapa = `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(termoBusca)}`;
      
      let estiloBorda = isPilha ? "border-orange-500" : "border-green-500";
      let icone = isPilha ? "⚠️" : "♻️";
      let corBotaoMapa = isPilha ? "bg-orange-600" : "bg-emerald-600";
      
      let botaoMapa = `<button type="button" onclick="window.open('${urlMapa}', '_blank')" class="w-full ${corBotaoMapa} text-white py-3 rounded-xl text-xs font-bold shadow-sm transition mt-2"><i class="fa-solid fa-map-location-dot"></i> Encontrar Ponto de Coleta</button>`;

      resultado.innerHTML = `
        <div class="space-y-3 mt-3 animate-fade-in">
          <div class="p-5 rounded-xl bg-slate-50 border-l-4 ${estiloBorda} shadow-sm">
            <div class="flex items-center gap-3 mb-2"><span class="text-2xl">${icone}</span><div><h4 class="font-bold text-slate-800 text-base">${dadosObjeto.nome}</h4><span class="text-xs font-bold uppercase text-green-600">${dadosObjeto.tipo}</span></div></div>
            <p class="text-sm text-slate-600">${dadosObjeto.dica}</p>
          </div>
          ${botaoMapa}
        </div>`;
    }
  } catch (e) { 
    console.error("ERRO SCAN:", e);
    resultado.innerHTML = `<div class="p-4 rounded-xl bg-red-50 text-red-900 text-xs font-semibold text-center mt-3">❌ Erro: ${e.message}</div>`; 
  }
};
