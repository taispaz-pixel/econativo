<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>

<title>EcoScan - Inteligência Ambiental</title>

<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />

<script type="module">
/* =========================
   FIREBASE IMPORTS
========================= */
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {
  getAuth,
  signInWithEmailAndPassword,
  createUserWithEmailAndPassword,
  signOut,
  onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {
  getFirestore,
  collection,
  addDoc,
  query,
  orderBy,
  onSnapshot,
  serverTimestamp
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

/* =========================
   FIREBASE CONFIG - 100% CORRIGIDA
========================= */
const firebaseConfig = {
  apiKey: "AIzaSyA0TLcy1zIAXwzgeYvmdKoqe04hPey1KXw",
  authDomain: "ecoscan-96a80.firebaseapp.com",
  projectId: "ecoscan-96a80",
  storageBucket: "ecoscan-96a80.appspot.com",
  messagingSenderId: "532877468700",
  appId: "1:532877468700:web:689d25217275313341abd9",
  measurementId: "G-ZN2B54CN07"
};

/* =========================
   INICIAR FIREBASE
========================= */
const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

/* =========================
   LOGIN
========================= */
window.login = async () => {
  const email = document.getElementById("email").value.trim();
  const senha = document.getElementById("senha").value;

  if (!email || !senha) {
    mostrarAviso("Preencha email e senha!", "erro");
    return;
  }

  try {
    await signInWithEmailAndPassword(auth, email, senha);
    mostrarAviso("Login realizado com sucesso! 🎉", "sucesso");
  } catch (error) {
    let mensagem = "Erro no login: ";
    switch(error.code) {
      case 'auth/user-not-found': mensagem = "Usuário não cadastrado"; break;
      case 'auth/wrong-password': mensagem = "Senha incorreta"; break;
      case 'auth/invalid-email': mensagem = "E-mail inválido"; break;
      default: mensagem += error.message;
    }
    mostrarAviso(mensagem, "erro");
  }
};

/* =========================
   CADASTRO
========================= */
window.registrar = async () => {
  const email = document.getElementById("email").value.trim();
  const senha = document.getElementById("senha").value;

  if (!email || !senha) {
    mostrarAviso("Preencha email e senha!", "erro");
    return;
  }

  if(senha.length < 6) {
    mostrarAviso("Senha deve ter pelo menos 6 caracteres", "erro");
    return;
  }

  try {
    await createUserWithEmailAndPassword(auth, email, senha);
    mostrarAviso("Conta criada com sucesso! 🎉", "sucesso");
  } catch (error) {
    let mensagem = "Erro no cadastro: ";
    switch(error.code) {
      case 'auth/email-already-in-use': mensagem = "E-mail já cadastrado"; break;
      case 'auth/invalid-email': mensagem = "E-mail inválido"; break;
      default: message += error.message;
    }
    mostrarAviso(mensagem, "erro");
  }
};

/* =========================
   LOGOUT
========================= */
window.logout = async () => {
  await signOut(auth);
  mostrarAviso("Você saiu da conta", "info");
};

/* =========================
   VERIFICAR LOGIN
========================= */
onAuthStateChanged(auth, (user) => {
  if (user) {
    document.getElementById("loginBox").classList.add("hidden");
    document.getElementById("appBox").classList.remove("hidden");
    document.getElementById("usuario").innerText = user.email;
    carregarMensagens();
  } else {
    document.getElementById("loginBox").classList.remove("hidden");
    document.getElementById("appBox").classList.add("hidden");
    pararCamera();
  }
});

/* =========================
   SISTEMA DE CÂMERA E SCAN
========================= */
let streamAtual = null;

window.abrirCamera = async () => {
  const video = document.getElementById("cameraFeed");
  const placeholder = document.getElementById("cameraPlaceholder");
  
  try {
    streamAtual = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: "environment", width: {ideal:1280}, height: {ideal:720} }
    });
    video.srcObject = streamAtual;
    video.classList.remove("hidden");
    placeholder.classList.add("hidden");
    mostrarAviso("Câmera ativada ✅", "info");
  } catch (err) {
    mostrarAviso("Permita o acesso à câmera nas configurações ⚠️", "erro");
  }
};

window.pararCamera = () => {
  if(streamAtual) {
    streamAtual.getTracks().forEach(track => track.stop());
    document.getElementById("cameraFeed").classList.add("hidden");
    document.getElementById("cameraPlaceholder").classList.remove("hidden");
    streamAtual = null;
  }
};

const bancoObjetos = [
  { nome: "Garrafa PET", tipo: "Plástico ♻️", cor: "red", dica: "Lave bem antes de descartar. Descarte na lixeira vermelha." },
  { nome: "Lata de Alumínio", tipo: "Metal ♻️", cor: "amber", dica: "Amasse para economizar espaço. Descarte na lixeira amarela." },
  { nome: "Caixa de Papelão", tipo: "Papel ♻️", cor: "blue", dica: "Desmonte e dobre, retire fitas. Descarte na lixeira azul." },
  { nome: "Pote de Vidro", tipo: "Vidro ♻️", cor: "green", dica: "Retire tampas e rótulos. Descarte na lixeira verde." },
  { nome: "Embalagem Longa Vida", tipo: "Material Híbrido", cor: "orange", dica: "Lave e seque. Descarte na lixeira laranja." },
  { nome: "Casca de Fruta", tipo: "Resíduo Orgânico 🌱", cor: "stone", dica: "Ideal para compostagem. Descarte na lixeira marrom." }
];

window.scanearObjeto = () => {
  const resultado = document.getElementById("resultadoScan");
  resultado.classList.remove("hidden");
  resultado.innerHTML = `
    <div class="text-center py-6">
      <i class="fa-solid fa-magnifying-glass text-4xl text-green-600 mb-3 animate-spin"></i>
      <p class="font-semibold text-slate-700">Analisando imagem...</p>
    </div>
  `;

  setTimeout(() => {
    const objeto = bancoObjetos[Math.floor(Math.random() * bancoObjetos.length)];
    
    resultado.innerHTML = `
      <div class="p-5 rounded-xl bg-slate-50 border-l-4 border-green-500 shadow-sm mt-3">
        <div class="flex items-center gap-3 mb-2">
          <span class="text-2xl">♻️</span>
          <div>
            <h4 class="font-bold text-base text-slate-800">${objeto.nome}</h4>
            <span class="text-xs font-bold uppercase text-green-600 tracking-wider">${objeto.tipo}</span>
          </div>
        </div>
        <p class="text-sm text-slate-600 leading-relaxed">${objeto.dica}</p>
      </div>
    `;

    const xpAtual = parseInt(document.getElementById("xpUsuario").innerText);
    document.getElementById("xpUsuario").innerText = xpAtual + 50;
    mostrarAviso("+50 Pontos Eco! 🌱", "sucesso");

  }, 2000);
};

/* =========================
   SISTEMA DE COMUNIDADE
========================= */
window.enviarMensagem = async () => {
  const texto = document.getElementById("novaMensagem").value.trim();
  const user = auth.currentUser;

  if(!user) { mostrarAviso("Faça login primeiro", "erro"); return; }
  if(!texto) { mostrarAviso("Digite uma mensagem", "erro"); return; }

  try {
    await addDoc(collection(db, "mensagens"), {
      usuario: user.email,
      texto: texto,
      data: serverTimestamp()
    });
    document.getElementById("novaMensagem").value = "";
  } catch(e) {
    mostrarAviso("Erro ao enviar mensagem", "erro");
  }
};

function carregarMensagens() {
  const q = query(collection(db, "mensagens"), orderBy("data", "desc"));
  onSnapshot(q, (snapshot) => {
    const lista = document.getElementById("listaMensagens");
    if(!lista) return;
    lista.innerHTML = "";
    snapshot.forEach(doc => {
      const msg = doc.data();
      const data = msg.data?.toDate() || new Date();
      
      lista.innerHTML += `
        <div class="p-3 bg-slate-50 rounded-xl mb-2 border-l-4 border-green-500 shadow-sm">
          <div class="flex justify-between items-center mb-1">
            <span class="font-bold text-xs text-green-700">${msg.usuario}</span>
            <span class="text-[10px] text-slate-400">${data.toLocaleTimeString()}</span>
          </div>
          <p class="text-sm text-slate-700">${msg.texto}</p>
        </div>
      `;
    });
  });
}

/* =========================
   UTILITÁRIOS
========================= */
function mostrarAviso(texto, tipo) {
  const aviso = document.getElementById("aviso");
  aviso.classList.remove("hidden", "bg-green-100", "bg-red-100", "bg-blue-100", "text-green-800", "text-red-800", "text-blue-800");
  
  let cor = "bg-blue-100 text-blue-800";
  if(tipo === "sucesso") cor = "bg-green-100 text-green-800";
  if(tipo === "erro") cor = "bg-red-100 text-red-800";

  aviso.className = `p-3 mb-4 rounded-xl text-sm font-medium ${cor}`;
  aviso.innerText = texto;
  aviso.classList.remove("hidden");

  setTimeout(() => aviso.classList.add("hidden"), 4000);
}

window.mudarAba = (nome) => {
  document.querySelectorAll(".aba-conteudo").forEach(el => el.classList.add("hidden"));
  document.querySelectorAll(".aba-btn").forEach(el => el.classList.remove("bg-green-600", "text-white"));

  document.getElementById(`aba-${nome}`).classList.remove("hidden");
  event.target.classList.add("bg-green-600", "text-white");

  if(nome === "escanear") abrirCamera();
  else pararCamera();
};
</script>

<style>
* { -webkit-tap-highlight-color: transparent; }
body{
  margin:0; padding:0; font-family: 'Arial', sans-serif;
  background: linear-gradient(135deg, #f0fdf4 0%, #dcfce7 100%); min-height: 100vh;
}
.card{
  background:white; border-radius:28px; padding:24px;
  box-shadow: 0 8px 32px rgba(22, 163, 74, 0.12); border: 1px solid rgba(22, 163, 74, 0.08);
}
.topo{
  background:linear-gradient(135deg, #16a34a 0%, #15803d 100%);
  border-radius:24px; padding:24px; color:white; margin-bottom:20px;
  box-shadow: 0 4px 12px rgba(21, 128, 61, 0.2);
}
.scan-frame {
  position: relative; width: 100%; height: 320px;
  border-radius: 20px; overflow: hidden; background: #000; margin: 15px 0;
}
.scan-line {
  position: absolute; width: 100%; height: 3px; background: #4ade80;
  box-shadow: 0 0 8px #4ade80; animation: scan 2s linear infinite; z-index: 10;
}
@keyframes scan{ 0% { top: 0%; } 50% { top: 100%; } 100% { top: 0%; } }
</style>
</head>

<body class="p-4">
<div class="w-full max-w-lg mx-auto">
  <div id="aviso" class="hidden p-3 mb-4 rounded-xl text-sm font-medium"></div>

  <div class="card">
    <div class="topo">
      <h1 class="text-2xl font-black flex items-center gap-2">🌱 EcoScan</h1>
      <p class="mt-1 opacity-90 text-xs">Inteligência Ambiental para um futuro sustentável</p>
      <div class="mt-3 flex justify-between items-center text-xs font-bold">
        <span>Progresso Eco:</span>
        <span class="bg-white/20 px-3 py-1 rounded-full">XP: <span id="xpUsuario">350</span></span>
      </div>
    </div>

    <div id="loginBox" class="space-y-4">
      <h3 class="text-lg font-bold text-slate-700 text-center mb-3">Acesse sua Conta</h3>
      <input id="email" type="email" placeholder="📧 Digite seu e-mail" class="w-full p-4 bg-slate-50 border border-slate-200 rounded-xl text-base focus:outline-none focus:ring-2 focus:ring-green-500" />
      <input id="senha" type="password" placeholder="🔒 Digite sua senha" class="w-full p-4 bg-slate-50 border border-slate-200 rounded-xl text-base focus:outline-none focus:ring-2 focus:ring-green-500" />
      
      <div class="grid grid-cols-2 gap-3 pt-2">
        <button onclick="login()" class="bg-green-600 text-white p-4 rounded-xl font-bold text-base shadow-md active:scale-95 hover:bg-green-700">Entrar</button>
        <button onclick="registrar()" class="bg-slate-900 text-white p-4 rounded-xl font-bold text-base shadow-md active:scale-95 hover:bg-slate-800">Criar Conta</button>
      </div>
    </div>

    <div id="appBox" class="hidden space-y-4">
      <div class="flex justify-between items-center bg-green-50 p-3 rounded-xl text-xs border border-green-100">
        <span class="text-slate-600 font-medium">👤 <span id="usuario"></span></span>
        <button onclick="logout()" class="text-red-600 font-bold hover:underline">Sair</button>
      </div>

      <div class="grid grid-cols-3 gap-1 bg-slate-100 p-1 rounded-xl">
        <button onclick="mudarAba('escanear')" class="aba-btn py-2.5 rounded-lg text-xs font-bold text-slate-600 bg-green-600 text-white">📷 Scanner</button>
        <button onclick="mudarAba('mapa')" class="aba-btn py-2.5 rounded-lg text-xs font-bold text-slate-600">📍 Mapa</button>
        <button onclick="mudarAba('chat')" class="aba-btn py-2.5 rounded-lg text-xs font-bold text-slate-600">💬 Mural</button>
      </div>

      <div id="aba-escanear" class="aba-conteudo space-y-3">
        <div class="scan-frame">
          <video id="cameraFeed" autoplay playsinline muted class="w-full h-full object-cover hidden"></video>
          <div id="cameraPlaceholder" class="absolute inset-0 bg-gradient-to-b from-slate-900 to-black flex flex-col items-center justify-center text-white">
            <i class="fa-solid fa-camera text-4xl opacity-20 mb-2"></i>
            <p class="text-xs opacity-40">Câmera aguardando ativação</p>
          </div>
          <div class="scan-line"></div>
        </div>
        <div class="grid grid-cols-2 gap-2">
          <button onclick="abrirCamera()" class="bg-green-600 text-white py-3 rounded-xl text-sm font-bold active:scale-95">📷 Ligar Câmera</button>
          <button onclick="scanearObjeto()" class="bg-amber-500 text-white py-3 rounded-xl text-sm font-bold active:scale-95">🔍 Analisar</button>
        </div>
        <div id="resultadoScan" class="hidden"></div>
      </div>

      <div id="aba-mapa" class="aba-conteudo hidden space-y-2">
        <h3 class="font-bold text-sm text-slate-700">📍 Postos de Reciclagem Próximos</h3>
        <div class="w-full h-60 bg-slate-100 rounded-xl overflow-hidden border border-slate-200">
          <iframe class="w-full h-full border-none" src="https://maps.google.com/maps?q=reciclagem&t=&z=13&ie=UTF-8&iwloc=&output=embed" allowfullscreen loading="lazy"></iframe>
        </div>
      </div>

      <div id="aba-chat" class="aba-conteudo hidden flex flex-col h-[380px]">
        <h3 class="font-bold text-sm text-slate-700 mb-2">💬 EcoMural em Tempo Real</h3>
        <div id="listaMensagens" class="flex-1 overflow-y-auto bg-slate-50 border border-slate-100 rounded-xl p-3 mb-2"></div>
        <div class="flex gap-2">
          <input id="novaMensagem" type="text" placeholder="Compartilhe uma dica sustentável..." class="flex-1 p-3 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-green-500" />
          <button onclick="enviarMensagem()" class="bg-green-600 text-white px-4 rounded-xl font-bold active:scale-95"><i class="fa-solid fa-paper-plane"></i></button>
        </div>
      </div>

    </div>
  </div>
</div>
</body>
</html>
