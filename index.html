<!DOCTYPE html>
<html lang="pt-BR">
<head>

<script src="https://cdn.tailwindcss.com"></script>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

const firebaseConfig = { apiKey: "AIzaSyA0TLcy1zIAXwzgeYvmdKoqe04hPey1KXw", authDomain: "ecoscan-96a80.firebaseapp.com", projectId: "ecoscan-96a80", storageBucket: "ecoscan-96a80.appspot.com", messagingSenderId: "532877468700", appId: "1:532877468700:web:689d25217275313341abd9", measurementId: "G-ZN2B54CN07" };
const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

const URL_MODELO = "https://teachablemachine.withgoogle.com/models/v7dY4t8c9/";
let model, maxPredictions;

async function carregarIA() {
  try {
    model = await tmImage.load(URL_MODELO + "model.json", URL_MODELO + "metadata.json");
    maxPredictions = model.getTotalClasses();
  } catch (e) { console.error("Erro IA:", e); }
}
carregarIA();

window.scanearObjeto = async () => {
  const resultado = document.getElementById("resultadoScan");
  const video = document.getElementById("cameraFeed");
  if (!model || !resultado) return;
  resultado.classList.remove("hidden");
  resultado.innerHTML = `<div class="p-4 text-center">Analisando...</div>`;
  try {
    const prediction = await model.predict(video);
    let mC = prediction.sort((a,b) => b.probability - a.probability)[0];
    resultado.innerHTML = `<div class="p-4 bg-white rounded-xl shadow mt-2 font-bold">${mC.className} (${(mC.probability*100).toFixed(0)}%)</div>`;
  } catch(e) { resultado.innerHTML = "Erro ao escanear."; }
};

window.login = async () => { try { await signInWithEmailAndPassword(auth, document.getElementById("email").value, document.getElementById("senha").value); } catch(e) { alert("Erro login"); } };
window.logout = async () => await signOut(auth);
window.mudarAba = (id) => {
    document.querySelectorAll('.aba').forEach(a => a.classList.add('hidden'));
    document.getElementById(id).classList.remove('hidden');
};
onAuthStateChanged(auth, (u) => {
    if(u) { document.getElementById("loginBox").classList.add("hidden"); document.getElementById("appBox").classList.remove("hidden"); }
    else { document.getElementById("loginBox").classList.remove("hidden"); document.getElementById("appBox").classList.add("hidden"); }
});
</script>
</head>
<body class="bg-green-50 p-4">
  <div class="max-w-lg mx-auto bg-white rounded-3xl p-6 shadow-xl">
    <div id="loginBox">
        <input id="email" type="email" placeholder="E-mail" class="w-full p-3 border rounded-xl mb-2">
        <input id="senha" type="password" placeholder="Senha" class="w-full p-3 border rounded-xl mb-4">
        <button onclick="login()" class="w-full bg-green-600 text-white p-3 rounded-xl font-bold">Entrar</button>
    </div>
    <div id="appBox" class="hidden">
        <div class="flex gap-2 mb-4">
            <button onclick="mudarAba('scan')" class="bg-green-600 text-white px-4 py-2 rounded-lg text-sm">Scanner</button>
            <button onclick="mudarAba('chat')" class="bg-slate-200 px-4 py-2 rounded-lg text-sm">Mural</button>
        </div>
        <div id="scan" class="aba">
            <video id="cameraFeed" autoplay playsinline class="w-full h-64 bg-black rounded-2xl object-cover"></video>
            <button onclick="scanearObjeto()" class="w-full mt-2 bg-amber-500 text-white py-4 rounded-xl font-bold">Analisar</button>
            <div id="resultadoScan" class="hidden"></div>
        </div>
        <div id="chat" class="aba hidden">Mural de Mensagens aqui...</div>
        <button onclick="logout()" class="text-red-500 text-xs mt-4">Sair</button>
    </div>
  </div>
</body>
</html>
